<header>
  <div class="header-row-main">
    <h1><a class="header-logo-link">Grawlix <span class="bubble">!@#$</span></a></h1>
    <div class="header-byline-group">
      <span class="header-byline">Made with ♥ by <a href="mailto:john@kugelman.name?subject=Grawlix">John Kugelman</a></span>
      <span class="header-sep">&middot;</span>
      <a href="https://github.com/jkugelman/grawlix" target="_blank" rel="noopener" title="View on GitHub" class="header-github-link"><svg width="15" height="15" aria-label="GitHub" role="img"><use href="#icon-github"/></svg></a>
    </div>
    <div class="header-utility">
      <button id="btn-settings" class="header-icon-btn" aria-label="Settings" title="Settings"><svg width="24" height="24" aria-hidden="true"><use href="#icon-settings"/></svg></button>
      <div class="split-btn header-help-menu">
        <button id="btn-help" class="header-icon-btn" aria-haspopup="menu" aria-label="Help" title="Help"><span class="icon help-circle">?</span></button>
        <div class="split-btn-menu" role="menu">
          <button id="menu-welcome" type="button" role="menuitem">Welcome</button>
          <button id="menu-acknowledgements" type="button" role="menuitem">Acknowledgements</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div id="picker-backdrop"></div>
<main>
  <div id="splash-screen">
    <div class="splash-logo">Grawlix <span class="bubble">!@#$</span></div>
    <div class="splash-spinner"><span></span><span></span><span></span></div>
  </div>
  <div id="app">
    <section id="featured-row" aria-label="Tools">
      <div class="picker-bar">
        <div class="picker-search-wrap">
          <svg width="13" height="13" aria-hidden="true"><use href="#icon-search"/></svg>
          <input id="tool-picker-search" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search tools…" title="Tools (Alt-T)">
        </div>
        <button type="button" class="picker-close" aria-label="Close tool picker" hidden>✕</button>
      </div>
      <div class="featured-cards"></div>
      <div class="picker-gallery"></div>
    </section>

    <div id="detail-panel"></div>

    <button type="button" id="add-fab" aria-label="Add entry" title="Add entry">＋</button>
  </div>
</main>

<script type="module" src="src/main.js"></script>
</body>
</html>
