// ─── Signals ──────────────────────────────────────────────────────────────────
//
// Hand-rolled minimal signals primitive. Reactivity for the structural state
// and view layer; the perf-critical caches (merged, override, stats) stay
// imperative and bump `cacheVersion$` to notify subscribers. ~50 lines, no
// external dependency — keeps grawlix's "no build step, no npm" property.
//
// Scope notes:
//   - No automatic dependency cleanup on re-runs (effects accumulate subs).
//     Fine for grawlix's small, stable graph.
//   - No batching primitive in the lib — `batchUpdate` already coalesces at
//     the call-site level.
//   - No async support; not needed.

let _currentEffect = null;
// While `_batchedEffects` is non-null, signal writes queue subscribers here
// instead of running them; the batch owner drains and runs each effect once.
// Coalesces multi-field updates (e.g. the configure-wordlist dialog save) so
// each effect sees a coherent post-batch state and runs once, not N times.
let _batchedEffects = null;

function _fireSubs(subs) {
  if (_batchedEffects) {
    for (const s of subs) _batchedEffects.add(s);
  } else {
    [...subs].forEach(s => s());
  }
}

function signal(initial) {
  let value = initial;
  const subs = new Set();
  return {
    get() { if (_currentEffect) subs.add(_currentEffect); return value; },
    peek() { return value; },          // non-subscribing read
    set(v) {
      if (Object.is(v, value)) return;
      value = v;
      _fireSubs(subs);
    },
    // For mutable values (arrays, maps): force notify even when ref is unchanged.
    bump() { _fireSubs(subs); },
  };
}

function effect(fn) {
  const run = () => {
    const prev = _currentEffect;
    _currentEffect = run;
    try { fn(); } finally { _currentEffect = prev; }
  };
  run();
  return run;
}

const SEVERITY_PRIORITY = { info: 1, warning: 2 };

function buildBadgeHTML(severity, opts = {}) {
  if (!severity) return '';
  const { count = null, title = '' } = opts;
  const classes = ['badge'];
  if (count != null) classes.push('badge--count');
  const titleAttr = title ? ` title="${esc(title)}" aria-label="${esc(title)}"` : '';
  const text = count != null ? esc(String(count)) : '';
  return `<span class="${classes.join(' ')}" data-severity="${severity}"${titleAttr}>${text}</span>`;
}

function maxSeverity(...severities) {
  let max = null;
  let maxPri = 0;
  for (const s of severities) {
    const p = SEVERITY_PRIORITY[s] ?? 0;
    if (p > maxPri) { max = s; maxPri = p; }
  }
  return max;
}

// Severity for a regular wordlist's card: uncovered raw scores (rule
// coverage gap) take priority over the update-available info.
function wordlistSeverity(wordlist) {
  if (wordlist._uncovered?.length) return 'warning';
  if (wordlist._updateAvailable) return 'info';
  return null;
}

// Severity for the All card: merged output scores not covered by any tier
// label on `state.scoring`.
function allSeverity() {
  return state._scoringUncovered.length ? 'warning' : null;
}

// Tooltip for a severity bubble. Causes (uncovered scores, update available)
// all roll up to the same severity → title mapping; that's the right level
// of detail for an at-a-glance tooltip.
function severityTitle(severity) {
  if (severity === 'warning') return 'Unhandled scores';
  if (severity === 'info')    return 'Update available';
  return '';
}

  const classes = ['wordlist-card'];

  if (!enabled)   classes.push('disabled');

  const btn = input.closest('.clearable-input')?.querySelector('.clear-btn');

function buildParamHTML(param, value, toolKey, wiring) {
  const titleAttr = param.title ? ` title="${esc(param.title)}"` : '';
  if (param.type === 'checkbox') {
    return `<span class="tool-row-param"><label${titleAttr}><input type="checkbox"${value ? ' checked' : ''}${wiring}> ${esc(param.label)}</label></span>`;
  }
  const labelHTML = param.label ? `<label>${esc(param.label)}</label>` : '';
  if (param.type === 'number') {
    return `<span class="tool-row-param">${labelHTML}<input type="number" min="1" class="tool-row-num"`
      + ` placeholder="${esc(param.placeholder || '')}" value="${esc(value || '')}"${wiring}></span>`;
  }
  if (param.type === 'range') {
    const choices = (param.choices || []).map(c => typeof c === 'string' ? { value: c, label: c } : c);
    const max = Math.max(0, choices.length - 1);
    const cur = String(value ?? param.default ?? choices[0]?.value ?? '').toLowerCase();
    const idx = Math.max(0, choices.findIndex(c => c.value.toLowerCase() === cur));
    const ticks = choices.map(c => `<span>${esc(c.label)}</span>`).join('');
    const valuesAttr = ` data-range-values="${esc(choices.map(c => c.value).join(','))}"`;
    return `<span class="tool-row-param tool-row-range">${labelHTML}<span class="tool-row-range-wrap">`
      + `<input type="range" min="0" max="${max}" step="1" value="${idx}"${valuesAttr}${wiring}>`
      + `<span class="tool-row-range-ticks">${ticks}</span>`
      + `</span></span>`;
  }
  return `<span class="tool-row-param tool-row-param-text">${labelHTML}${buildTextInputHTML(param, value, toolKey, wiring)}</span>`;
}

    + `<svg class="find-replace-caret-glyph" width="11" height="11" aria-hidden="true"><use href="#icon-chevron-right"/></svg></button>`;
}

function buildToolRowPartsHTML(params, values, toolKey, wiringFn, opts = {}) {
  const asideEls = [];
  let main = '';
  let caret = '';
  let replace = '';
  let frPattern = null, frReplace = null;
  if (opts.findReplace) {
    frPattern = params.find(p => p.type !== 'checkbox' && p.key !== 'replace');
    frReplace = params.find(p => p.key === 'replace');
    if (frPattern && frReplace) {
      const expanded = !!opts.expanded;
      caret = buildFindReplaceCaretHTML(expanded, opts.rowToken);
      const patternInput = buildTextInputHTML(frPattern, values?.[frPattern.key], toolKey, wiringFn(frPattern));
      main = `<span class="tool-row-param tool-row-param-text">${patternInput}</span>`;
      const replaceInput = buildTextInputHTML(frReplace, values?.[frReplace.key], toolKey, wiringFn(frReplace));
      replace = `<span class="tool-row-param tool-row-param-text tool-row-replace"${expanded ? '' : ' hidden'}>${replaceInput}</span>`;
    } else {
      frPattern = frReplace = null;
    }
  }
  for (const p of params) {
    if (p === frPattern || p === frReplace) continue;
    const html = buildParamHTML(p, values?.[p.key], toolKey, wiringFn(p));
    if (p.type === 'checkbox') asideEls.push(html);
    else if (!main) main = html;
    else asideEls.push(html);
  }
  const asides = asideEls.length ? `<div class="tool-row-asides">${asideEls.join('')}</div>` : '';
  return { caret, main, asides, replace };
}

  // a baked-in index would silently point at the wrong row once tools are

  const parts = buildToolRowPartsHTML(TOOLS.search.params, row.params, 'search',
    p => ` data-row="bar" data-key="${p.key}"${p.key === 'pattern' ? ' title="Search (Alt-S)"' : ''}`,

  const label = buildToolLabelHTML({ icon: '<svg width="16" height="16" aria-hidden="true"><use href="#icon-search"/></svg>', name: 'Search' });
  return `<div class="search-bar">
      <span class="drag-handle" aria-hidden="true">≡</span>
      ${label}
      ${parts.caret}
      ${parts.main}
      ${parts.asides}

}

class PopupHelp {
  constructor(anchor, contentHTML, opts = {}) {
    this.anchor = anchor;
    this.placement = opts.placement || 'above';
    this.offset = opts.offset ?? 6;

    this.el = document.createElement('div');
    this.el.className = 'popup-help';
    this.el.innerHTML = contentHTML;
    // Keep the anchor focused when the popover is clicked — otherwise blur
    // hides the popover before a click on a link inside it can land.
    this.el.addEventListener('mousedown', e => e.preventDefault());
    document.body.appendChild(this.el);

    this._onFocus = () => this.show();
    this._onBlur  = () => this.hide();
    this._reflow  = () => { if (this._open) this._position(); };
    this._onKeyDown = (e) => {
      if (e.key === 'Escape' && this._open) {
        this.hide();
        e.stopPropagation();
      }
    };
    anchor.addEventListener('focus', this._onFocus);
    anchor.addEventListener('blur',  this._onBlur);
    anchor.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('resize', this._reflow);
    window.addEventListener('scroll', this._reflow, true);

    if (anchor === document.activeElement) this.show();
  }

  show() {
    if (window.matchMedia('(max-width: 759px)').matches) return;
    this._open = true;
    this._position();
    this.el.classList.add('open');
  }

  hide() {
    this._open = false;
    this.el.classList.remove('open');
  }

  _position() {
    const aRect = this.anchor.getBoundingClientRect();
    const eRect = this.el.getBoundingClientRect();
    let above = this.placement === 'above';
    if (above && aRect.top - eRect.height - this.offset < 8) above = false;
    else if (!above && aRect.bottom + this.offset + eRect.height > window.innerHeight - 8) above = true;
    const top = above
      ? aRect.top - eRect.height - this.offset
      : aRect.bottom + this.offset;
    const maxLeft = window.innerWidth - eRect.width - 8;
    const left = Math.max(8, Math.min(aRect.left, maxLeft));
    this.el.style.top  = top  + 'px';
    this.el.style.left = left + 'px';
  }

  destroy() {
    this.anchor.removeEventListener('focus', this._onFocus);
    this.anchor.removeEventListener('blur',  this._onBlur);
    this.anchor.removeEventListener('keydown', this._onKeyDown);
    window.removeEventListener('resize', this._reflow);
    window.removeEventListener('scroll', this._reflow, true);
    this.el.remove();
  }
}

// `stats` drives the numeric readouts (count/min/max); `hist`
// ({ entries, ignoredCount }) drives the histogram bars. Splitting them lets
// the score-range filter shrink the numbers without making bars outside the
// selection vanish — those bars stay sourced from the pre-score-range set.
function buildStatsBarHTML(stats, hist, layout, opts = {}) {
  const {
    countValue = stats.count,
    groupCount = null,
    scoreRange = null,
    sortHTML = '',
    sortSlotId = '',
    exportHTML = '',
  } = opts;
  const isEmpty = !countValue;
  const dash = '—';
  const fmt = v => isEmpty ? dash : v;
  const ignored = hist.ignoredCount || 0;
  const counts = bucketCounts(hist.entries || [], layout);
  const scale = Math.max(ignored, ...counts, 1);
  const barH = c => c === 0 ? 0 : Math.max(2, Math.round((c / scale) * 34));

  const ignoredTitle = ignored > 0 ? ` title="${pluralize(ignored, 'entry', 'entries')} ignored"` : '';
  const ignoredBar = ignored > 0
    ? `<div class="histogram-col histogram-col-ignored"${ignoredTitle}><div class="histogram-bar histogram-bar-ignored" style="height:${barH(ignored)}px"></div></div>`
    : '';

  const bars = layout.slots.map((s, i) => {
    const c = counts[i];
    const title = `${pluralize(c, 'entry', 'entries')} scored ${s.label} • Click to filter`;
    const { bg } = scoreColor((s.lo + s.hi) / 2);
    return `<div class="histogram-col" title="${title}"><div class="histogram-bar" data-lo="${s.lo}" data-hi="${s.hi}" style="--score-bg:${bg}; height:${barH(c)}px"></div></div>`;
  }).join('');

  const countsHTML = groupCount != null
    ? buildStatItemHTML('Entries', countValue.toLocaleString()) +
      buildStatItemHTML('Groups', groupCount.toLocaleString())
    : buildStatItemHTML('Entries', countValue.toLocaleString());

  const rangeHTML = scoreRange
    ? buildScoreRangeInputHTML(scoreRange.inputId, scoreRange.value, scoreRange.viewName)
    : '';
  const sortSlotHTML = sortHTML
    ? `<span class="stats-bar-sort"${sortSlotId ? ` id="${sortSlotId}"` : ''}>${sortHTML}</span>`
    : (sortSlotId ? `<span class="stats-bar-sort" id="${sortSlotId}"></span>` : '');
  const exportSlotHTML = exportHTML ? `<span class="stats-bar-export">${exportHTML}</span>` : '';

  return `<div class="stats-bar${isEmpty ? ' stats-empty' : ''}">
      <div class="stats-bar-counts">${countsHTML}</div>
      <div class="stats-bar-distribution">
        <div class="stats-bar-numbers">
          ${buildStatItemHTML('Min', fmt(stats.min), null, 'stat-far')}
          ${buildStatItemHTML('Max', fmt(stats.max), null, 'stat-far')}
        </div>
        <div class="histogram" title="Histogram • Click to filter" onpointerdown="onHistogramPointerDown(event)">${ignoredBar}${bars}<div class="histogram-rect" hidden></div></div>
      </div>
      <div class="stats-bar-controls">${rangeHTML}${sortSlotHTML}${exportSlotHTML}</div>
    </div>`;
}

function buildRuleRowHTML(i, fieldsHTML, note, onDeleteFn, readOnly = false) {

    ? `<span class="rule-note-wrap${note ? ' has-note' : ''}"><span class="rule-note-text">${esc(note||'')}</span></span>`
    : `<span class="rule-note-wrap${note ? ' has-note' : ''}" onclick="startNoteEdit(this)" title="Click to edit">
        <span class="rule-note-text">${esc(note||'')}</span>
        ${buildEditHintHTML('rule-note-pencil', 'startNoteEdit(this.parentElement)')}
      </span>`;
  const delBtn = readOnly ? '' : `<button class="icon rule-del" onclick="${onDeleteFn}(${i})" title="Delete row">${buildTrashIconHTML()}</button>`;
  return `<div class="rule-row" data-i="${i}">
      ${fieldsHTML}
      ${noteWrap}
      ${delBtn}
    </div>`;
}

function buildRuleBannerHTML(scores, addFn = '') {
  const runs = scoresToRuns(scores);
  const action = addFn
    ? `<button type="button" class="rule-banner-action" onclick="${addFn}()">Add ${plural(runs.length, 'rule')}</button>`
    : '';
  return `<div class="rule-banner" role="status">
      <span class="rule-banner-icon" aria-hidden="true">⚠️</span>
      <span class="rule-banner-body">Unhandled ${plural(scores.length, 'score')}: ${esc(runs.map(runToRangeStr).join(', '))}</span>
      ${action}
    </div>`;
}

function buildRulesListHTML(rules, { rulesId, saveFn, deleteFn, addFn = '', resetFn = '', uncovered = [], addUncoveredFn = '', dirty = false, rescore = false, readOnly = false }) {
  // Uncovered scores surface as a banner above the list; rule authoring goes
  // through the `+ Add rule` button below. The two split off what used to be
  // a single dual-purpose row in the editor.
  const banner = (!readOnly && uncovered.length)
    ? buildRuleBannerHTML(uncovered, addUncoveredFn)
    : '';

  let rulesHTML;
  if (!rules.length && rescore) {
    rulesHTML = '<div class="no-rules">No rules — entries kept as-is</div>';
  } else {
    rulesHTML = rules.map((r, i) => {
      const inputInvalid = !readOnly && parseRange((r.input || '').trim()) === null;
      const disabled = readOnly ? ' disabled' : '';
      const inputHandlers = readOnly ? '' : ` oninput="onRuleInput(this)" onchange="${saveFn}(${i},'input',this.value)"`;
      let fieldsHTML = `<input class="rule-in${inputInvalid ? ' invalid' : ''}" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(r.input)}"
            title="Score range: 50, 50-59, or 50+"${disabled}${inputHandlers}>`;
      if (rescore) {
        const lenVal = (r.length || '').trim();
        const lenInvalid = !readOnly && lenVal !== '' && parseRange(lenVal) === null;
        const outInvalid = !readOnly && isRuleOutputInvalid(r.input, r.output);
        const lenHandlers = readOnly ? '' : ` oninput="onRuleInput(this)" onchange="${saveFn}(${i},'length',this.value)"`;
        const outHandlers = readOnly ? '' : ` oninput="onRuleInput(this)" onchange="${saveFn}(${i},'output',this.value)"`;
        fieldsHTML += `
          <span class="rule-field-lbl">length</span><input class="rule-len${lenInvalid ? ' invalid' : ''}" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(r.length||'')}" placeholder="any"
            title="Entry length filter: 7, 7-10, or 7+ (blank = any length)"${disabled}${lenHandlers}>
          <span class="rule-arrow">→</span>
          <input class="rule-out${outInvalid ? ' invalid' : ''}" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(r.output)}" placeholder="unchanged"
            title="Output score, 'ignore', or blank for unchanged"${disabled}${outHandlers}>`;
      }
      return buildRuleRowHTML(i, fieldsHTML, r.note, deleteFn, readOnly);
    }).join('');
  }
  const addBtn = (!readOnly && addFn) ? `<button class="rule-add-btn" onclick="${addFn}()">+ Add rule</button>` : '';
  const resetBtn = (!readOnly && resetFn && dirty) ? `<button class="rule-reset-btn" onclick="${resetFn}()">Reset to defaults</button>` : '';
  const actionsRow = (addBtn || resetBtn) ? `<div class="rule-actions">${addBtn}${resetBtn}</div>` : '';
  return `${banner}<div id="${rulesId}">${rulesHTML}</div>${actionsRow}`;
}

function buildRescoreSectionHTML(wordlist) {

const Collapsible = (() => {
  function buildHTML({ id = '', className = '', labelHTML, contentHTML, collapsed = false }) {
    const cls = ['collapsible', className, collapsed && 'collapsed'].filter(Boolean).join(' ');
    const idAttr = id ? ` id="${id}"` : '';
    return `<div${idAttr} class="${cls}">
        <button type="button" class="collapsible-toggle" aria-expanded="${!collapsed}">
          <span class="collapsible-chevron" aria-hidden="true">▾</span>
          ${labelHTML}
        </button>
        <div class="collapsible-content">${contentHTML}</div>
      </div>`;
  }

  // Caller wires persistence (localStorage, signal, etc.) by listening for
  // `collapsible:toggle` on the wrapper or any ancestor.
  document.addEventListener('click', e => {
    const toggle = e.target.closest('.collapsible-toggle');
    if (!toggle) return;
    const wrapper = toggle.closest('.collapsible');
    if (!wrapper) return;
    const collapsed = !wrapper.classList.contains('collapsed');
    wrapper.classList.toggle('collapsed', collapsed);
    toggle.setAttribute('aria-expanded', String(!collapsed));
    wrapper.dispatchEvent(new CustomEvent('collapsible:toggle', { detail: { collapsed }, bubbles: true }));
  });

  return { buildHTML };
})();

// ─── Router ───────────────────────────────────────────────────────────────────
// Keeps the URL in sync with the active view and the tool stack via
// history.replaceState. URL shape:
//   bare URL              → default view, no query
//   #/<view>              → named view, no query
//   #/<view>?<query>      → named view with query state
// The default view (Workshop today) gets the bare-URL form when its query is
// empty, so the most-shared case stays short. MainView owns the view registry;
// Router treats view names opaquely.
//
// Query encoding: each pipeline row in order — its tool name carries the
// first param's value (`tool=value`), and each successive param is its own
// adjacent key (a bare key for a true checkbox, `key=value` for a non-empty
// text param, omitted at default). The permanent Search bar is the final
// row. See docs/design.md § URL state. The score filter is intentionally
// *not* in the URL — it's per-user (scores aren't portable across wordlist
// setups) and lives in localStorage.
const Router = (() => {
  // One tool row → its URL key(s). The first param rides on the tool-name
  // key so the row always has an anchor (kept even when empty, so an
  // unfilled row survives reload); a param-less tool is a bare tool key.
  function encodeRow(row) {
    if (row.grouped) return [encodeURIComponent(row.tool), 'all'];
    const { params: schema } = row.def;
    const slug = encodeURIComponent(row.tool);
    if (!schema.length) return [slug];
    const parts = [slug + '=' + encodeURIComponent(row.params[schema[0].key] || '')];
    for (const p of schema.slice(1)) {
      const v = row.params[p.key];
      if (p.type === 'checkbox') { if (v) parts.push(encodeURIComponent(p.key)); }
      else if (v)                parts.push(encodeURIComponent(p.key) + '=' + encodeURIComponent(v));
    }
    return parts;
  }

  function rowIsDefault(row) {
    return row.def.params.every(p => !row.params[p.key]);
  }

  function buildQuery() {
    // The full pipeline — user tools plus the permanent Search bar as its
    // last row. Each row serializes via encodeRow; empty values are kept
    // (`anagram=`) so an added-but-unfilled row survives reload. The lone
    // exception is the Search bar: its keys are elided when it's at default
    // state *and* not preceded by another Search row, so an untouched app
    // stays at a bare URL while an added Search tool still round-trips.
    const stack = ToolStack.getStack();
    const parts = [];
    stack.forEach((row, i) => {
      const isBar = i === stack.length - 1;
      if (isBar && rowIsDefault(row) && stack[i - 1]?.tool !== 'search') return;
      parts.push(...encodeRow(row));
    });
    const tier = chainSortTier(stack);
    const defaultAxis = WORKSHOP_DEFAULT_SORT_BY_TIER[tier];
    if (WorkshopView.sortKey !== defaultAxis)                  parts.push('sort=' + WorkshopView.sortKey);
    if (WorkshopView.sortDir !== defaultSortDir(WorkshopView.sortKey)) parts.push('sort-dir=' + WorkshopView.sortDir);
    return parts.join('&');
  }

  function buildHash() {
    const view = MainView.getCurrent();
    const def  = MainView.getDefault();
    // Query state belongs to the active view. Today the pipeline is Workshop's
    // (default view) and no other view has URL-bound state — so when we're on
    // Library, the URL is route-only and the pipeline lives in memory until
    // the user switches back. When another view gains URL state, give it its
    // own builder (e.g. per-view query-builders registered with MainView).
    const query = view === def ? buildQuery() : '';
    if (view === def && !query) return '';
    return '#/' + view + (query ? '?' + query : '');
  }

  function navigate() {
    const target = location.pathname + buildHash();
    if (location.pathname + location.hash !== target) {
      history.replaceState(null, '', target);
    }
  }

  // Returns the view to activate. State (tool stack, search) is applied as a
  // side effect. The score filter is loaded from localStorage in init() and
  // doesn't participate in URL routing.
  function applyURL() {
    let view = MainView.getDefault();
    let queryString = '';
    const hash = location.hash;
    if (hash.startsWith('#/')) {
      const rest  = hash.slice(2);
      const qIdx  = rest.indexOf('?');
      const route = qIdx >= 0 ? rest.slice(0, qIdx) : rest;
      if (MainView.hasView(route)) {
        view = route;
        queryString = qIdx >= 0 ? rest.slice(qIdx + 1) : '';
      }
      // Unknown route → fall through to default view; drop the query (it was
      // most likely intended for a view that has been renamed or removed).
    }

    const params = new URLSearchParams(queryString);
    const rows = [];
    let sortKey = null;
    let sortDir = null;
    let droppedUnknown = false;
    // All param names across the catalog — lets the decoder tell a genuinely
    // unknown key (likely a removed tool) from a merely misplaced param.
    const knownParam = new Set(Object.values(TOOLS).flatMap(t => t.params.map(p => p.key)));
    // Each key is one of three things: a tool name (starts a new row, its
    // value is the first param), a reserved view-config key, or a successive
    // param of the most recent row (a bare key sets a checkbox true).
    for (const [key, value] of params) {
      if (key === 'sort')     { if (isValidSortAxis(value)) sortKey = value; continue; }
      if (key === 'sort-dir') { if (value === 'asc' || value === 'desc') sortDir = value; continue; }
      if (key === 'all') {
        const cur = rows[rows.length - 1];
        if (cur && cur.def.group) {
          if (rows.some(r => r.grouped)) {
            rows.pop();
          } else {
            cur.grouped = true;
            cur.params = {};
          }
        }
        continue;
      }
      const tool = TOOLS[key];
      if (tool) {
        const row = makeToolRow(key);
        if (tool.params.length) row.params[tool.params[0].key] = value || '';
        rows.push(row);
        continue;
      }
      const cur = rows[rows.length - 1];
      const pdef = cur && cur.def.params.find(p => p.key === key);
      if (pdef) { cur.params[key] = pdef.type === 'checkbox' ? true : (value || ''); continue; }
      // A key that's not a tool, not reserved, and not any tool's param name
      // is a genuinely unknown key — most likely a tool that's been removed.
      if (!knownParam.has(key)) droppedUnknown = true;
    }
    // The decoded rows are the full pipeline; ToolStack keeps the trailing
    // Search row as the permanent bar (appending an empty one if absent).
    // Stack is set first so applyURLState can derive the current atom count
    // when picking the sort default (a stacked-output URL with no explicit
    // sort= should pick min-score, not the 1-atom default entry).
    ToolStack.setStack(rows);
    WorkshopView.applyURLState({ sortKey, sortDir });
    if (droppedUnknown) {
      // Defer: showToast appends to the toast container which may not be in
      // the DOM yet during initial load.
      setTimeout(() => showToast("That link references a tool that's no longer available."), 0);
    }
    return view;
  }

  return { navigate, applyURL };
})();

// ─── State ────────────────────────────────────────────────────────────────────

// Default tier labels for the unified score scale. Stored on `state.scoring`
// and surfaced as a read/write legend on the merged All view.
const DEFAULT_SCORING = [
  { input: '60', note: 'Good (colorful phrases, sayings, people, etc.)' },
  { input: '50', note: 'Average (dictionary words and phrases)' },
  { input: '40', note: 'Okay in moderation (proper names, abbreviations, prepositional phrases)' },
  { input: '30', note: 'Not good (plural names, crosswordese, contrived inflections)' },
  { input: '20', note: 'Junk (partials, variant spellings, Roman numerals)' },
  { input: '10', note: 'Offensive' },
  { input: '0',  note: 'Gibberish' },
];

// Top-level state. `sources$` is the array of wordlists, signal-backed so
// the cosmetic effect can subscribe; reorder/add/remove call `sources$.bump()`
// after splicing (signal equality is by reference, so plain mutation needs a
// bump). Per-view UI state (search/sort/score-range, focused wordlist, display
// mode) lives inside each view's IIFE — WorkshopView and LibraryView — not
// here.
const sources$  = signal([]);

// `cacheVersion$` is bumped whenever the imperative caches change (full
// invalidation or in-place patch). The render effect subscribes to it so
// cache-impacting changes trigger a repaint without manual dispatch.
const cacheVersion$ = signal(0);
function bumpCacheVersion() { cacheVersion$.set(cacheVersion$.peek() + 1); }

// Reads through `state.sources` are non-subscribing (peek). Effects that
// need to re-run on changes read the underlying signal explicitly with
// `.get()`. This keeps the imperative call sites unchanged while preventing
// accidental over-subscription from incidental reads inside effects.
const state = {
  get sources()  { return sources$.peek(); },
  set sources(v) { sources$.set(v); },
  // Tier labels for the unified score scale. Single source of truth for what
  // each score range means to the user; edited from All's pane and used
  // everywhere scores get a tooltip. No signal — mutators call
  // `persistScoring()` and `renderScoringRules()` explicitly.
  scoring: [],
  // True when state.scoring has been customized away from DEFAULT_SCORING.
  // Drives `propagateDefaults` at boot (pristine users silently pick up dev
  // updates) and the "Reset to defaults" button visibility.
  scoringDirty: false,
  // Transient: merged-output scores not covered by any tier label.
  // Recomputed by recomputeScoringUncovered; drives the Unhandled-scores
  // banner on All's pane and the warning bubble on the All card.
  _scoringUncovered: [],
};

// Per-wordlist cosmetic fields are signal-backed: each wordlist exposes both
// `wl.name`/`wl.icon`/etc. (peek getter, set setter) and `wl.name$`/`wl.icon$`
// for explicit subscriptions. The cosmetic effect subscribes to all four
// across every wordlist.
//
// Cache-affecting fields (`enabled`, `rescoreRules`, `rawEntries`) and
// transient fields (`_loading`, `_updateAvailable`, `lastUpdated`, etc.) are
// plain properties: their mutation goes through a helper that handles the
// invalidation/persistence/dispatch explicitly. See "Mutation helpers" below.
const REACTIVE_WORDLIST_FIELDS = ['name', 'icon', 'url', 'publisherId'];

function wrapWordlist(wl) {
  if (wl.name$) return wl;  // already wrapped
  for (const field of REACTIVE_WORDLIST_FIELDS) {
    const sig = signal(wl[field]);
    delete wl[field];
    Object.defineProperty(wl, field + '$', { value: sig });
    Object.defineProperty(wl, field, {
      get() { return sig.peek(); },
      set(v) { sig.set(v); },
      enumerable: true,
      configurable: false,
    });
  }
  return wl;
}

// ─── Parsing ─────────────────────────────────────────────────────────────────

const FOLD_MAP = {
  'ß': 'ss',
  'ø': 'o',  'Ø': 'O',
  'æ': 'ae', 'Æ': 'AE',
  'œ': 'oe', 'Œ': 'OE',
  'þ': 'th', 'Þ': 'TH',
  'ð': 'd',  'Ð': 'D',
  'ł': 'l',  'Ł': 'L',
  'đ': 'd',  'Đ': 'D',
  'ı': 'i',  'İ': 'I',
};
const FOLD_RE = new RegExp(`[${Object.keys(FOLD_MAP).join('')}]`, 'g');

function stripAccents(s) {
  return s.replace(FOLD_RE, c => FOLD_MAP[c])
          .normalize('NFKD')
          .replace(/\p{M}/gu, '');
}

function toNorm(s) {
  return stripAccents(s).toLowerCase().replace(/[^a-z0-9]/g, '');
}

function buildNormToDisplay(display) {
  if (display == null) return null;
  const map = [];
  for (let i = 0; i < display.length; i++) {
    const stripped = stripAccents(display[i]).toLowerCase();
    for (const c of stripped) {
      if (c >= 'a' && c <= 'z' || c >= '0' && c <= '9') map.push(i);
    }
  }
  return new Uint16Array(map);
}

function normToDisplayMap(wlEntry) {
  if (wlEntry.display == null) return null;
  return wlEntry._normMap ??= buildNormToDisplay(wlEntry.display);
}

function displayOf(wlEntry) {
  return wlEntry.display ?? wlEntry.norm;
}

function projectRangesToDisplay(ranges, wlEntry) {
  if (!ranges?.length) return ranges;
  const map = normToDisplayMap(wlEntry);
  if (!map) return ranges;
  const display = wlEntry.display;
  return ranges.map(r => {
    if (r.coord === 'display') return r;
    if (r.start >= map.length) return { ...r, start: display.length, end: display.length };
    const start = map[r.start];
    const endIdx = Math.min(r.end - 1, map.length - 1);
    const end = endIdx >= 0 ? map[endIdx] + 1 : start;
    return { ...r, start, end };
  });
}

function parseWordlistLine(line) {
  if (!line) return null;
  const semi = line.indexOf(';');
  if (semi === -1) return null;
  const raw = line.slice(0, semi).trim();
  if (!raw || raw.includes(';')) return null;
  const rest = line.slice(semi + 1);
  const semi2 = rest.indexOf(';');
  const score = parseInt(semi2 === -1 ? rest : rest.slice(0, semi2), 10);
  if (isNaN(score)) return null;
  const comment = semi2 === -1 ? '' : rest.slice(semi2 + 1).trim();
  return { raw, score, comment };
}

function classifyWordlist(rawEntries) {
  if (!rawEntries.length) return 'plain';
  let richCount = 0, upperOnly = 0, lowerOnly = 0;
  for (const { raw } of rawEntries) {
    const hasNonAlnum = /[^A-Za-z0-9]/.test(raw);
    const hasUpper = /[A-Z]/.test(raw);
    const hasLower = /[a-z]/.test(raw);
    if (hasNonAlnum || (hasUpper && hasLower)) richCount++;
    else if (hasUpper) upperOnly++;
    else if (hasLower) lowerOnly++;
  }
  if (richCount / rawEntries.length > 0.01) return 'rich';
  if (upperOnly > 0 && lowerOnly > 0) return 'rich';
  return 'plain';
}

function parseWordlist(text) {
  const rawEntries = [];
  for (const line of text.split('\n')) {
    const parsed = parseWordlistLine(line);
    if (parsed) rawEntries.push(parsed);
  }
  const richness = classifyWordlist(rawEntries);
  return rawEntries.map(({ raw, score, comment }) => buildWlEntry(raw, score, comment, richness));
}

function buildWlEntry(raw, score, comment, richness) {
  const norm = toNorm(raw);
  const display = richness === 'plain' ? null : raw;
  return { norm, display, score, comment };
}

function buildUserWlEntry(raw, score, comment) {
  const trimmed = raw.trim();
  return { norm: toNorm(trimmed), display: trimmed, score, comment };
}

function synthWlEntry(text, score) {
  const norm = toNorm(text);
  const display = text === norm ? null : text;
  return { norm, display, score, comment: '', wordlist: null };
}

// Validates a chunk from a Range GET. Drops the last line (may be truncated
// at the Range boundary); skips semicolon-less lines as comments/headers.
function validateWordlistChunk(text) {
  const lines = text.split('\n').slice(0, -1).filter(l => l.length > 0);
  if (!lines.length) return false;
  const dataLines = lines.filter(l => l.includes(';'));
  if (!dataLines.length) return false;
  return dataLines.every(l => parseWordlistLine(l) !== null);
}

// ─── Storage ──────────────────────────────────────────────────────────────────

function lsSave(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, value); return true; }
  catch { return false; }
}
function lsLoad(key) { return localStorage.getItem(LS_PREFIX + key); }
function lsDel(key)  { localStorage.removeItem(LS_PREFIX + key); }

// Bump when the shape of stored data (localStorage `meta`, IDB entries) changes
// in a way that older code can't read. Mismatch on load triggers a reset prompt.
//   v4 — drop state.outputScoring; tier labels live exclusively on My Edits' `scoring`.
//   v5 — tier labels move off My Edits to top-level `state.scoring` (its own
//        localStorage key); My Edits gains a normal rescoreRules editor.
//   v7 — drop rescoring from My Edits; user-typed scores pass through unchanged.
const SCHEMA_VERSION = 7;

// IndexedDB for large wordlist data (localStorage has ~5MB limit)
const IDB_NAME  = 'grawlix';
const IDB_STORE = 'data';
let _db = null;

async function resetAllDataAndReload() {
  await Storage.reset();
  location.reload();
  // location.reload() is asynchronous — JS keeps running until the navigation
  // actually fires. Block the caller so it can't re-persist the state we just
  // wiped (init() in particular would write a fresh `meta` back to localStorage
  // and leave the SCHEMA_VERSION warning re-armed for the next load).
  await new Promise(() => {});
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess = e => { _db = e.target.result; resolve(); };
    req.onerror   = () => reject(req.error);
  });
}

function idbPut(key, val) {
  return new Promise(resolve => {
    const tx = _db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = resolve;
    tx.onerror    = resolve;
  });
}

function idbGet(key) {
  return new Promise(resolve => {
    const tx  = _db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result ?? null);
    req.onerror   = () => resolve(null);
  });
}

function idbDel(key) {
  return new Promise(resolve => {
    const tx = _db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(key);
    tx.oncomplete = resolve;
    tx.onerror    = resolve;
  });
}

// Opaque IDB key. Avoids crypto.randomUUID because WebKit gates it on
// secure contexts, which breaks local-network mobile testing over HTTP.
function newDbKey() {
  const hex = (n) => Array.from({ length: n }, () => Math.floor(Math.random() * 16).toString(16)).join('');
  return `${hex(8)}-${hex(4)}-${hex(4)}-${hex(4)}-${hex(12)}`;
}

const IdbBackend = {
  schemaVersion() { const v = parseInt(lsLoad('schemaVersion'), 10); return Number.isFinite(v) ? v : null; },
  setSchemaVersion(v) { lsSave('schemaVersion', String(v)); },
  hasData() { return lsLoad('meta') !== null; },

  readMeta() {
    const raw = lsLoad('meta');
    if (!raw) return null;
    try { return JSON.parse(raw); }
    catch { return null; }
  },
  writeMeta(sources) { lsSave('meta', JSON.stringify(sources)); },

  readScoring() {
    const raw = lsLoad('scoring');
    if (!raw) return null;
    try { return { scoring: JSON.parse(raw), dirty: lsLoad('scoringDirty') === '1' }; }
    catch { return null; }
  },
  writeScoring(scoring, dirty) {
    lsSave('scoring', JSON.stringify(scoring));
    lsSave('scoringDirty', dirty ? '1' : '0');
  },

  readMergedSettings() {
    try { return JSON.parse(lsLoad('mergedSettings')) || {}; }
    catch { return {}; }
  },
  writeMergedSettings(s) { lsSave('mergedSettings', JSON.stringify(s)); },

  async readWordlist(wordlist) { return idbGet('data_' + wordlist.dbKey); },
  async writeWordlist(wordlist, text) { await idbPut('data_' + wordlist.dbKey, text); },
  async deleteWordlist(wordlist) { await idbDel('data_' + wordlist.dbKey); },
  async writeRescored() {},
  async writeAllRescored() {},

  async reset() {
    Object.keys(localStorage).filter(k => k.startsWith(LS_PREFIX)).forEach(k => localStorage.removeItem(k));
    if (_db) { _db.close(); _db = null; }
    await new Promise(resolve => {
      const req = indexedDB.deleteDatabase(IDB_NAME);
      req.onsuccess = resolve;
      req.onerror   = resolve;
      req.onblocked = resolve;
    });
  },
};

const DISK_HANDLE_IDB_KEY = '_diskFolderHandle';
const GRAWLIX_JSON_NAME   = 'grawlix.json';
const README_NAME         = 'README.txt';

const README_TEXT = `Grawlix folder

const DiskBackend = {
  _handle: null,
  _cache: null,
  _pending: false,
  _inFlight: false,

  attach(handle, cache) {
    this._handle = handle;
    this._cache = cache;
  },
  isAttached() { return this._handle !== null; },
  handle() { return this._handle; },

  schemaVersion()      { return this._cache?.schemaVersion ?? null; },
  setSchemaVersion(v)  { this._cache.schemaVersion = v; this._queueWrite(); },
  hasData()            { return this._cache !== null; },

  readMeta()           { return this._cache?.sources ?? null; },
  writeMeta(sources)   { this._cache.sources = sources; this._queueWrite(); },

  readScoring() {
    if (!this._cache || !this._cache.scoring) return null;
    return { scoring: this._cache.scoring, dirty: !!this._cache.scoringDirty };
  },
  writeScoring(scoring, dirty) {
    this._cache.scoring = scoring;
    this._cache.scoringDirty = !!dirty;
    this._queueWrite();
  },

  readMergedSettings()  { return this._cache?.mergedSettings ?? {}; },
  writeMergedSettings(s) { this._cache.mergedSettings = s; this._queueWrite(); },

  async readWordlist(wordlist) {
    if (!wordlist.filename) return null;
    return Disk.readFile(this._handle, wordlist.filename);
  },
  async writeWordlist(wordlist, text) {
    if (!wordlist.filename) wordlist.filename = `${wordlist.name}.txt`;
    await withOwnWrite(wordlist.filename, () => Disk.writeFile(this._handle, wordlist.filename, text));
    await this.writeRescored(wordlist);
    await this.writeAllRescored();
  },
  async deleteWordlist(wordlist) {
    if (!wordlist.filename) return;
    await Disk.deleteFile(this._handle, wordlist.filename);
    const r = rescoredNameFor(wordlist.filename);
    if (r) await Disk.deleteFile(this._handle, r);
    await this.writeAllRescored();
  },
  async writeRescored(wordlist) {
    if (!wordlist.filename || wordlist.type === 'edits') return;
    const name = rescoredNameFor(wordlist.filename);
    if (!name) return;
    const entries = sortedEntries(applyRescoring(wordlist.rawEntries, wordlist.rescoreRules || []));
    await withOwnWrite(name, () => Disk.writeFile(this._handle, name, entriesToText(entries)));
  },
  async writeAllRescored() {
    const entries = sortedEntries(buildMergedWordlist().entries);
    await withOwnWrite(ALL_RESCORED_NAME, () => Disk.writeFile(this._handle, ALL_RESCORED_NAME, entriesToText(entries)));
  },

  async reset() {
    this._handle = null;
    this._cache = null;
    await Disk.clearHandle();
    await IdbBackend.reset();
    Storage = IdbBackend;
  },

  _queueWrite() {
    this._pending = true;
    if (!this._inFlight) this._flush();
  },
  async _flush() {
    this._inFlight = true;
    while (this._pending) {
      this._pending = false;
      try {
        await Disk.writeFile(this._handle, GRAWLIX_JSON_NAME,
          JSON.stringify(this._cache, null, 2));
      } catch (err) { console.error('grawlix.json write failed', err); }
    }
    this._inFlight = false;
  },
};

const NullBackend = {
  schemaVersion()        { return SCHEMA_VERSION; },
  setSchemaVersion()     {},
  hasData()              { return false; },
  readMeta()             { return null; },
  writeMeta()            {},
  readScoring()          { return null; },
  writeScoring()         {},
  readMergedSettings()   { return {}; },
  writeMergedSettings()  {},
  async readWordlist()   { return null; },
  async writeWordlist()  {},
  async deleteWordlist() {},
  async writeRescored()  {},
  async writeAllRescored() {},
  async reset()          {},
};

function rescoredNameFor(filename) {
  if (!filename) return null;
  const base = filename.endsWith('.txt') ? filename.slice(0, -4) : filename;
  return `${base} rescored.txt`;
}

const ALL_RESCORED_NAME = `${MERGED_NAME} rescored.txt`;

const DISK_WATCHER_INTERVAL = 2000;

async function withOwnWrite(name, op) {
  DiskWatcher.holdName(name);
  try {
    await op();
    DiskWatcher.recordOwnWrite(name);
  } finally {
    DiskWatcher.releaseName(name);
  }
}

const DiskWatcher = {
  _snapshot: new Map(),
  _ownWrites: new Set(),
  _heldNames: new Map(),
  _intervalId: null,

  start() {
    if (this._intervalId) return;
    this._tick();
    this._intervalId = setInterval(() => this._tick(), DISK_WATCHER_INTERVAL);
    document.addEventListener('visibilitychange', this._onVisibility);
  },

  stop() {
    if (this._intervalId) { clearInterval(this._intervalId); this._intervalId = null; }
    document.removeEventListener('visibilitychange', this._onVisibility);
  },

  _onVisibility() {
    if (document.visibilityState === 'visible') DiskWatcher._tick();
  },

  recordOwnWrite(filename) {
    this._ownWrites.add(filename);
  },

  holdName(name) {
    this._heldNames.set(name, (this._heldNames.get(name) || 0) + 1);
  },
  releaseName(name) {
    const c = this._heldNames.get(name) || 0;
    if (c <= 1) this._heldNames.delete(name);
    else this._heldNames.set(name, c - 1);
  },

  async _tick() {
    if (document.visibilityState === 'hidden') return;
    if (Storage !== DiskBackend) return;
    const handle = DiskBackend.handle();
    if (!handle) return;

    const seenNames = new Set();
    const changed = [];
    try {
      for await (const entry of handle.values()) {
        if (entry.kind !== 'file') continue;
        const name = entry.name;
        seenNames.add(name);
        if (this._heldNames.has(name)) continue;
        const file = await entry.getFile();
        const mtime = file.lastModified;

        if (this._ownWrites.has(name)) {
          this._ownWrites.delete(name);
          this._snapshot.set(name, mtime);
          continue;
        }

        const prev = this._snapshot.get(name);
        this._snapshot.set(name, mtime);
        if (prev === undefined || prev === mtime) continue;
        changed.push({ name, file });
      }
    } catch (err) {
      console.error('Disk watcher tick failed', err);
      return;
    }

    for (const name of [...this._snapshot.keys()]) {
      if (!seenNames.has(name)) this._snapshot.delete(name);
    }

    for (const { name, file } of changed) {
      await this._applyExternalChange(name, file);
    }
  },

  async _applyExternalChange(name, file) {
    if (name === GRAWLIX_JSON_NAME || name === README_NAME) return;
    if (name.endsWith(' rescored.txt')) return;
    if (!name.endsWith('.txt')) return;

    const wl = state.sources.find(s => s.filename === name);
    if (!wl) return;

    const text = await file.text();
    const newEntries = parseWordlist(text);

    batchUpdate(() => {
      wl.rawEntries = newEntries;
      wl.lastUpdated = Date.now();
      invalidateActualScoresCache(wl);
      invalidateWordlistCaches(wl);
      recomputeUncovered(wl);
      repaintAfterCacheChange();
    });

    await Storage.writeRescored(wl);
  },
};

let Storage = IdbBackend;

const Disk = {
  isSupported() { return typeof window.showDirectoryPicker === 'function'; },

  async pickFolder(opts = {}) {
    if (!Disk.isSupported()) return null;
    try {
      return await window.showDirectoryPicker({ id: 'grawlix', mode: 'readwrite', ...opts });
    } catch (e) {
      if (e?.name === 'AbortError') return null;
      throw e;
    }
  },

  async hasPermission(handle, mode = 'readwrite') {
    if (!handle) return false;
    return (await handle.queryPermission?.({ mode })) === 'granted';
  },
  async requestPermission(handle, mode = 'readwrite') {
    if (!handle) return false;
    return (await handle.requestPermission?.({ mode })) === 'granted';
  },

  async saveHandle(handle) { await idbPut(DISK_HANDLE_IDB_KEY, handle); },
  async loadHandle()        { return idbGet(DISK_HANDLE_IDB_KEY); },
  async clearHandle()       { await idbDel(DISK_HANDLE_IDB_KEY); },

  async listFiles(handle) {
    const names = [];
    for await (const entry of handle.values()) {
      if (entry.kind === 'file') names.push(entry.name);
    }
    return names;
  },

  async readFile(handle, name) {
    try {
      const fh = await handle.getFileHandle(name);
      return await (await fh.getFile()).text();
    } catch (e) {
      if (e?.name === 'NotFoundError') return null;
      throw e;
    }
  },

  async writeFile(handle, name, text) {
    const fh = await handle.getFileHandle(name, { create: true });
    const w  = await fh.createWritable();
    await w.write(text);
    await w.close();
  },

  async deleteFile(handle, name) {
    try { await handle.removeEntry(name); }
    catch (e) { if (e?.name !== 'NotFoundError') throw e; }
  },

  async identifyFolder(handle) {
    let hasGrawlixJson = false;
    let hasOther = false;
    for await (const entry of handle.values()) {
      if (entry.kind === 'file' && entry.name === GRAWLIX_JSON_NAME) hasGrawlixJson = true;
      else hasOther = true;
    }
    if (hasGrawlixJson) return 'grawlix';
    if (hasOther) return 'other';
    return 'empty';
  },
};

function persistMeta() {
  if (_batchDepth > 0) { _persistPending = true; return; }
  _persistMetaNow();
}

function serializeMetaEntry(l) {
  return {
    ...(l.type ? { type: l.type } : {}),
    dbKey: l.dbKey,
    ...(l.filename ? { filename: l.filename } : {}),
    ...(l.icon ? { icon: l.icon } : {}),
    ...(l.publisherId ? { publisherId: l.publisherId } : {}),
    name: l.name, url: l.url || null,
    enabled: l.enabled, populated: l.populated, lastUpdated: l.lastUpdated || null,
    fetchedSize: l.fetchedSize || null,
    rescoreRules: l.rescoreRules || [],
    ...(l.dirty ? { dirty: true } : {}),
    originalFilename: l.originalFilename || null,
    ...(l.downloadCase ? { downloadCase: l.downloadCase } : {}),
    ...(l.downloadExt  ? { downloadExt:  l.downloadExt  } : {}),
    ...(l.downloadStem ? { downloadStem: l.downloadStem } : {}),
  };
}

function _persistMetaNow() {
  Storage.writeMeta(state.sources.map(serializeMetaEntry));
  Storage.writeAllRescored().catch(err => console.error('writeAllRescored failed', err));
}

function persistScoring() {
  Storage.writeScoring(state.scoring, state.scoringDirty);
}

const DARK_MODE_CYCLE = ['auto', 'light', 'dark'];
const DARK_MODE_LABELS = { auto: 'Auto', light: 'Light', dark: 'Dark' };

function applyDarkMode(val) {
  const dark = val === 'dark' || (val !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark-mode', dark);
  document.documentElement.classList.toggle('light-mode', !dark);
}

function cycleDarkMode() {
  const current = lsLoad('darkMode') || 'auto';
  const next = DARK_MODE_CYCLE[(DARK_MODE_CYCLE.indexOf(current) + 1) % DARK_MODE_CYCLE.length];
  lsSave('darkMode', next);
  applyDarkMode(next);
  const seg = document.getElementById('dark-mode-seg');
  if (seg) seg.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.val === next));
  showToast(`Dark mode: ${DARK_MODE_LABELS[next]}`);
}

// ─── Dialog helpers ───────────────────────────────────────────────────────────

function enableDismissClicks(el) {
  el.addEventListener('click', e => {
    if (e.target === el || e.target.closest('.dialog-close-btn, .dialog-cancel-btn')) el.close();
  });
}

function showDialog(el, onClose = null) {
  const opener = document.activeElement;
  el.returnValue = '';
  el.addEventListener('close', () => {
    opener?.focus();
    onClose?.();
  }, { once: true });
  el.showModal();
  if (!el.querySelector('[autofocus]')) {
    el.tabIndex = -1;
    el.focus();
  }
}

function createDialog(id, { labelledby, label } = {}) {
  const el = document.createElement('dialog');
  el.id = id;
  if (labelledby) el.setAttribute('aria-labelledby', labelledby);
  if (label)      el.setAttribute('aria-label', label);
  enableDismissClicks(el);
  const body = document.createElement('div');
  body.className = 'dialog-body';
  el.appendChild(body);
  document.body.appendChild(el);
  return { el, body };
}
