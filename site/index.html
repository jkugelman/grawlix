        const load = await showConfirm(
          `"${handle.name}" already has Grawlix data. Did you mean to use it as an existing folder?`,
          { confirmText: 'Load this data', cancelText: 'Pick different folder', danger: false }
        );
        return load ? openMergeDialog(handle) : 'retry';
      }
      if (identity === 'other') {
        const choice = await showNewOtherAnomaly(handle);
        if (choice === 'subfolder') {
          let sub;
          try { sub = await handle.getDirectoryHandle('grawlix', { create: true }); }
          catch (err) { await showAlert(`Couldn't create subfolder: ${esc(err.message || err)}`); return 'retry'; }
          return setupNew(sub);
        }
        if (choice === 'alongside') return setupNew(handle);
        return 'retry';
      }
    }
    if (intent === 'existing') {
      if (identity === 'grawlix') return openMergeDialog(handle);
      if (identity === 'empty') {
        const ok = await showConfirm(
          `"${handle.name}" is empty. Set up Grawlix here instead?`,
          { confirmText: 'Set up here', cancelText: 'Pick different folder', danger: false }
        );
        return ok ? setupNew(handle) : 'retry';
      }
      if (identity === 'other') {
        await showAlert(`"${handle.name}" has files but isn't a Grawlix folder. Pick a different folder.`);
        return 'retry';
      }
    }
  }

  async function setupNew(handle) {
    try { await migrateToDisk(handle); }
    catch (err) { showAlert(`Migration failed: ${esc(err.message || err)}`); return; }
    showToast(`Storage is now in "${handle.name}".`);
    setTimeout(() => location.reload(), 900);
  }

  async function openMergeDialog(handle) {
    let folderSettings;
    try {
      const text = await Disk.readFile(handle, GRAWLIX_JSON_NAME);
      if (text == null) throw new Error('grawlix.json not found');
      folderSettings = JSON.parse(text);
    } catch (err) {
      await showAlert(`Couldn't read grawlix.json: ${esc(err.message || err)}`);
      return 'retry';
    }

    if (folderSettings.schemaVersion !== SCHEMA_VERSION) {
      await showAlert(`This folder was written with a different version of Grawlix (schema ${folderSettings.schemaVersion}; this Grawlix expects ${SCHEMA_VERSION}). Storage isn't compatible.`);
      return 'retry';
    }

    const diff = await computeMergeDiff(handle, folderSettings);
    const result = await showMergeChoice(handle, diff);
    if (!result) return 'retry';

    try { await applyMerge(handle, folderSettings, diff, result); }
    catch (err) { await showAlert(`Loading from folder failed: ${esc(err.message || err)}`); return; }
    showToast(`Storage is now in "${handle.name}".`);
    setTimeout(() => location.reload(), 900);
  }

  async function computeMergeDiff(handle, folderSettings) {
    const folderSources = folderSettings.sources || [];
    const deviceSources = state.sources;

    const replaced = [];
    const folderOnly = [];
    const matchedDevice = new Set();

    for (const fw of folderSources) {
      if (fw.type === 'edits') continue;
      const dw = deviceSources.find(d =>
        d.type !== 'edits' &&
        d.name === fw.name &&
        (d.publisherId || null) === (fw.publisherId || null)
      );
      if (dw) { replaced.push(fw.name); matchedDevice.add(dw); }
      else    { folderOnly.push(fw); }
    }
    const deviceOnly = deviceSources.filter(d => d.type !== 'edits' && !matchedDevice.has(d));

    const folderEdits = folderSources.find(s => s.type === 'edits');
    const deviceEdits = getEditsWordlist();
    let editsConflicts = [];
    let folderEditsEntries = null;
    if (folderEdits) {
      const text = folderEdits.filename ? await Disk.readFile(handle, folderEdits.filename) : null;
      folderEditsEntries = text ? parseWordlist(text) : [];
      if (deviceEdits) {
        const fm = new Map(folderEditsEntries.map(e => [e.norm, e]));
        for (const d of deviceEdits.rawEntries) {
          const f = fm.get(d.norm);
          if (f && (f.score !== d.score || (f.comment || '') !== (d.comment || ''))) {
            editsConflicts.push({
              entry: d.display ?? d.norm,
              device: { score: d.score, comment: d.comment },
              folder: { score: f.score, comment: f.comment },
              norm: d.norm,
            });
          }
        }
      }
    }

    return { replaced, folderOnly, deviceOnly, folderEdits, folderEditsEntries, deviceEdits, editsConflicts };
  }

  function showMergeChoice(handle, diff) {
    return new Promise(resolve => {
      const replacedHTML = diff.replaced.length
        ? `<p class="merge-section-label">These wordlists will be replaced by the folder's version:</p>
           <ul class="merge-list">${diff.replaced.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`
        : '';

      const editsHTML = diff.editsConflicts.length
        ? `<div class="merge-edits">
             <span class="merge-edits-label">My Edits: ${diff.editsConflicts.length} ${diff.editsConflicts.length === 1 ? 'entry differs' : 'entries differ'} — keep</span>
             <label class="merge-edits-pick"><input type="radio" name="edits-pick" value="device"> this device</label>
             <label class="merge-edits-pick"><input type="radio" name="edits-pick" value="folder"> folder</label>
             <button type="button" class="merge-toggle">show entries ▾</button>
             <div class="merge-entries" hidden>
               ${diff.editsConflicts.map(c => `<div class="merge-entry-row"><b>${esc(c.entry)}</b> this device: ${c.device.score}${c.device.comment ? ' (' + esc(c.device.comment) + ')' : ''} | folder: ${c.folder.score}${c.folder.comment ? ' (' + esc(c.folder.comment) + ')' : ''}</div>`).join('')}
             </div>
           </div>`
        : '';

      mergeBody.innerHTML = `
        <button type="button" class="dialog-close-btn" aria-label="Close">✕</button>
        <form method="dialog">
          <h2 id="storage-merge-title">Load Grawlix data from this folder?</h2>
          ${replacedHTML}
          ${editsHTML}
          <div class="dialog-footer">
            <button type="button" class="dialog-cancel-btn">Cancel</button>
            <button id="btn-merge-load" class="primary" value="ok">Load</button>
          </div>
        </form>
      `;

      const loadBtn = mergeBody.querySelector('#btn-merge-load');
      if (diff.editsConflicts.length) {
        loadBtn.disabled = true;
        mergeBody.querySelectorAll('input[name="edits-pick"]').forEach(r => {
          r.onchange = () => { loadBtn.disabled = false; };
        });
        const toggle = mergeBody.querySelector('.merge-toggle');
        const entries = mergeBody.querySelector('.merge-entries');
        toggle.onclick = () => {
          entries.hidden = !entries.hidden;
          toggle.textContent = entries.hidden ? 'show entries ▾' : 'hide entries ▴';
        };
      }

      showDialog(mergeEl, () => {
        if (mergeEl.returnValue !== 'ok') return resolve(null);
        const editsChoice = mergeBody.querySelector('input[name="edits-pick"]:checked')?.value || null;
        resolve({ editsChoice });
      });
    });
  }

  async function applyMerge(handle, folderSettings, diff, choice) {
    const newSources = [];

    for (const fw of (folderSettings.sources || [])) {
      if (fw.type === 'edits') continue;
      const text = fw.filename ? await Disk.readFile(handle, fw.filename) : null;
      newSources.push(wordlistFromMeta(fw, text));
    }

    for (const dw of diff.deviceOnly) {
      if (!dw.filename) dw.filename = `${dw.name}.txt`;
      const text = await IdbBackend.readWordlist(dw);
      await Disk.writeFile(handle, dw.filename, text ?? '');
      newSources.push(dw);
    }

    let editsWl = null;
    if (diff.folderEdits && diff.deviceEdits) {
      const conflictNorms = new Set(diff.editsConflicts.map(c => c.norm));
      const useDevice = choice.editsChoice === 'device';
      const folderMap = new Map((diff.folderEditsEntries || []).map(e => [e.norm, e]));
      const deviceMap = new Map(diff.deviceEdits.rawEntries.map(e => [e.norm, e]));
      const merged = [];
      const seen = new Set();
      for (const fe of (diff.folderEditsEntries || [])) {
        merged.push(conflictNorms.has(fe.norm) && useDevice ? deviceMap.get(fe.norm) : fe);
        seen.add(fe.norm);
      }
      for (const de of diff.deviceEdits.rawEntries) {
        if (!seen.has(de.norm)) merged.push(de);
      }
      const fwm = diff.folderEdits;
      editsWl = wordlistFromMeta(
        { ...fwm, filename: fwm.filename || 'My Edits.txt', dbKey: fwm.dbKey || diff.deviceEdits.dbKey },
        entriesToText(merged)
      );
    } else if (diff.folderEdits) {
      const fwm = diff.folderEdits;
      const text = fwm.filename ? await Disk.readFile(handle, fwm.filename) : null;
      editsWl = wordlistFromMeta(fwm, text);
    } else if (diff.deviceEdits) {
      const dw = diff.deviceEdits;
      if (!dw.filename) dw.filename = 'My Edits.txt';
      await Disk.writeFile(handle, dw.filename, entriesToText(dw.rawEntries));
      editsWl = dw;
    }
    if (editsWl) newSources.unshift(editsWl);

    state.sources = newSources;
    if (folderSettings.scoring) {
      state.scoring = folderSettings.scoring;
      state.scoringDirty = !!folderSettings.scoringDirty;
    }

    const cache = {
      schemaVersion: SCHEMA_VERSION,
      sources: state.sources.map(serializeMetaEntry),
      scoring: state.scoring,
      scoringDirty: state.scoringDirty,
      mergedSettings: folderSettings.mergedSettings || {},
    };

    if (editsWl && diff.folderEdits && diff.deviceEdits) {
      await Disk.writeFile(handle, editsWl.filename, entriesToText(editsWl.rawEntries));
    }
    for (const wl of newSources) {
      if (wl.type === 'edits' || !wl.filename) continue;
      const entries = sortedEntries(applyRescoring(wl.rawEntries, wl.rescoreRules || []));
      await Disk.writeFile(handle, rescoredNameFor(wl.filename), entriesToText(entries));
    }
    await Disk.writeFile(handle, ALL_RESCORED_NAME, entriesToText(sortedEntries(buildMergedWordlist().entries)));
    await Disk.writeFile(handle, README_NAME, README_TEXT);
    await Disk.writeFile(handle, GRAWLIX_JSON_NAME, JSON.stringify(cache, null, 2));
    await Disk.saveHandle(handle);

    DiskBackend.attach(handle, cache);
    Storage = DiskBackend;

    state.sources.forEach(invalidateWordlistCaches);
    propagateDefaults();
    sources$.bump();
    renderAll();
  }

  function showNewOtherAnomaly(handle) {
    anomalyBody.innerHTML = `
      <button type="button" class="dialog-close-btn" aria-label="Close">✕</button>
      <form method="dialog">
        <h2 id="storage-anomaly-title">This folder isn't empty</h2>
        <p class="dialog-msg">"${esc(handle.name)}" has files but doesn't look like a Grawlix folder.</p>
        <div class="dialog-footer dialog-footer-stacked">
          <button class="primary" value="different" autofocus>Pick a different folder</button>
          <button value="subfolder">Create a 'grawlix' subfolder here</button>
          <button class="danger" value="alongside">Add Grawlix files alongside what's here</button>
        </div>
      </form>
    `;
    return new Promise(resolve => {
      showDialog(anomalyEl, () => resolve(anomalyEl.returnValue || 'different'));
    });
  }

  function renderInfo() {
    body.innerHTML = `
      <button class="dialog-close-btn" aria-label="Close">✕</button>
      <h2 id="storage-dialog-title">Saving to disk</h2>
      <p class="storage-pitch">Saving your wordlists to a folder on disk requires Chrome, Edge, or another Chromium-based browser. In Firefox and Safari, Grawlix saves your data inside the browser — which works fine for one device but can't sync to a folder your construction software reads.</p>
      <div class="dialog-footer">
        <button type="button" class="dialog-cancel-btn primary" autofocus>Close</button>
      </div>
    `;
  }

  function renderOn() {
    const folderName = DiskBackend.handle()?.name || '(unknown)';
    body.innerHTML = `
      <button class="dialog-close-btn" aria-label="Close">✕</button>
      <h2 id="storage-dialog-title">Storage</h2>
      <p class="storage-pitch">Grawlix wordlists are saved to disk so your construction software can use them directly. Edits in either place flow to the other automatically.</p>
      <div class="storage-folder-chip"><span class="storage-folder-chip-icon">📁</span>${esc(folderName)}</div>
      <div class="dialog-footer dialog-footer-split">
        <button type="button" id="btn-storage-off">Turn off</button>
        <button type="button" class="dialog-cancel-btn primary">Close</button>
      </div>
    `;
    body.querySelector('#btn-storage-off').onclick = () => {
      el.close();
      openTurnOffDialog();
    };
  }

  function openTurnOffDialog() {
    turnOffBody.innerHTML = `
      <button type="button" class="dialog-close-btn" aria-label="Close">✕</button>
      <form method="dialog">
        <h2 id="storage-turnoff-title">Turn off storage</h2>
        <p class="dialog-msg">Grawlix will stop saving to disk. What about the files?</p>
        <div class="dialog-footer dialog-footer-stacked">
          <button value="keep" autofocus>Keep files on disk</button>
          <button class="danger" value="delete">Delete files from disk</button>
          <button type="button" class="dialog-cancel-btn">Cancel</button>
        </div>
      </form>
    `;
    showDialog(turnOffEl, async () => {
      const v = turnOffEl.returnValue;
      if (v !== 'keep' && v !== 'delete') return;
      try { await turnOffStorage({ deleteFiles: v === 'delete' }); }
      catch (err) { showAlert(`Turning off storage failed: ${esc(err.message || err)}`); }
    });
  }

  function open() {
    if (!Disk.isSupported())           renderInfo();
    else if (DiskBackend.isAttached()) renderOn();
    else                               renderOff();
    showDialog(el);
  }

  return { open };
})();

function getStorageLabel() {
  const edits = getEditsWordlist();
  if (!edits || !edits.rawEntries.length) return null;
  return Storage === DiskBackend ? 'Saved to disk' : 'Saved in browser';
}

function refreshStorageButton() {
  const btn = document.getElementById('btn-storage');
  if (!btn) return;
  const slash = btn.querySelector('.storage-slash');
  if (slash) slash.hidden = Storage === DiskBackend;
  const labelEl = btn.querySelector('.storage-label');
  if (!labelEl) return;
  const label = getStorageLabel();
  if (label) {
    labelEl.textContent = label;
    labelEl.classList.add('visible');
  } else {
    labelEl.classList.remove('visible');
  }
}

async function turnOffStorage({ deleteFiles }) {
  const handle = DiskBackend.handle();
  if (deleteFiles && handle) {
    for (const name of await Disk.listFiles(handle)) {
      if (name === GRAWLIX_JSON_NAME || name === README_NAME || name.endsWith('.txt')) {
        await Disk.deleteFile(handle, name);
      }
    }
  }
  await DiskBackend.reset();
  location.reload();
  await new Promise(() => {});
}

async function loadDiskCache(handle) {
  let text;
  try { text = await Disk.readFile(handle, GRAWLIX_JSON_NAME); }
  catch { return null; }
  if (text == null) return null;
  let cache;
  try { cache = JSON.parse(text); }
  catch { return null; }
  if (cache.schemaVersion !== SCHEMA_VERSION) {
    await showAlert(`This folder was written with a different version of Grawlix (schema ${cache.schemaVersion}; this Grawlix expects ${SCHEMA_VERSION}). Storage isn't compatible.`);
    return null;
  }
  return cache;
}

const BlockingDialog = (() => {
  let _hasAnimatedIn = false;

  function ensureOverlay() {
    let overlay = document.getElementById('busy-overlay');
    if (overlay) return overlay;
    overlay = document.createElement('div');
    overlay.id = 'busy-overlay';
    overlay.innerHTML = `<div class="busy-logo">Grawlix <span class="bubble">!@#$</span></div><div class="busy-spinner"><span></span><span></span><span></span></div>`;
    document.body.appendChild(overlay);
    return overlay;
  }

  function show(initialHandle) {
    return new Promise(resolve => {
      const overlay = ensureOverlay();
      const spinner = overlay.querySelector('.busy-spinner');

      const finish = (result) => {
        overlay.querySelectorAll('.busy-actions').forEach(e => e.remove());
        if (spinner) spinner.hidden = false;
        resolve(result);
      };

      if (spinner) spinner.hidden = true;
      renderAccess(overlay, initialHandle, finish);
    });
  }

  function renderAccess(overlay, handle, finish) {
    setActions(overlay, [
      { label: 'Load Grawlix data', primary: true, onclick: async () => {
        const granted = await Disk.requestPermission(handle);
        if (!granted) { renderUnavailable(overlay, handle, finish); return; }
        const cache = await loadDiskCache(handle);
        if (!cache) { renderUnavailable(overlay, handle, finish); return; }
        finish({ mode: 'disk', handle, cache });
      } },
      canInstall() && { label: 'Install Grawlix', onclick: async () => {
        await tryInstall();
        overlay.querySelector('.busy-actions button.primary').click();
      } },
      { label: 'Use without disk storage this session', onclick: () => finish({ mode: 'session' }) },
    ]);
  }

  function renderUnavailable(overlay, handle, finish) {
    setActions(overlay, [
      { label: 'Try again', primary: true, onclick: async () => {
        const granted = handle ? await Disk.requestPermission(handle) : false;
        if (!granted) return;
        const cache = await loadDiskCache(handle);
        if (!cache) return;
        finish({ mode: 'disk', handle, cache });
      } },
      { label: 'Pick a different folder', onclick: async () => {
        let newHandle;
        try { newHandle = await Disk.pickFolder(); }
        catch { return; }
        if (!newHandle) return;
        await Disk.saveHandle(newHandle);
        const cache = await loadDiskCache(newHandle);
        if (!cache) { renderUnavailable(overlay, newHandle, finish); return; }
        finish({ mode: 'disk', handle: newHandle, cache });
      } },
      { label: 'Use without disk storage this session', onclick: () => finish({ mode: 'session' }) },
    ]);
  }

  function setActions(overlay, actions) {
    overlay.querySelectorAll('.busy-actions').forEach(e => e.remove());
    const div = document.createElement('div');
    div.className = _hasAnimatedIn ? 'busy-actions' : 'busy-actions animated';
    _hasAnimatedIn = true;
    for (const a of actions.filter(Boolean)) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = a.label;
      if (a.primary) btn.className = 'primary';
      btn.onclick = a.onclick;
      div.appendChild(btn);
    }
    overlay.appendChild(div);
    (div.querySelector('.primary') || div.querySelector('button'))?.focus();
  }

  return { show };
})();

const SessionPausedBanner = (() => {
  let bannerEl = null;

  function show() {
    if (bannerEl) { bannerEl.hidden = false; return; }
    bannerEl = document.createElement('div');
    bannerEl.id = 'storage-paused-banner';
    bannerEl.innerHTML = `
      <span>Disk storage paused for this session — your data is safe in your folder.</span>
      <button type="button" id="banner-reload">Reload to try again</button>
      <button type="button" id="banner-turn-off">Turn off storage</button>
    `;
    document.body.insertBefore(bannerEl, document.body.firstChild);
    bannerEl.querySelector('#banner-reload').onclick = () => location.reload();
    bannerEl.querySelector('#banner-turn-off').onclick = async () => {
      const ok = await showConfirm(
        'Turn off disk storage? Your files on disk are left untouched. This Grawlix will switch to browser storage.',
        { confirmText: 'Turn off', danger: true }
      );
      if (!ok) return;
      await Disk.clearHandle();
      await IdbBackend.reset();
      location.reload();
    };
  }

  return { show };
})();

async function attemptDiskBoot() {
  const handle = await Disk.loadHandle();
  if (!handle) return { mode: 'none' };
  if (await Disk.hasPermission(handle)) {
    const cache = await loadDiskCache(handle);
    if (cache) return { mode: 'disk', handle, cache };
  }
  return BlockingDialog.show(handle);
}

async function migrateToDisk(handle) {
  for (const wl of state.sources) {
    if (!wl.filename) wl.filename = `${wl.name}.txt`;
  }
  for (const wl of state.sources) {
    const text = await IdbBackend.readWordlist(wl);
    await Disk.writeFile(handle, wl.filename, text ?? '');
    if (wl.type !== 'edits') {
      const entries = sortedEntries(applyRescoring(wl.rawEntries, wl.rescoreRules || []));
      await Disk.writeFile(handle, rescoredNameFor(wl.filename), entriesToText(entries));
    }
  }
  await Disk.writeFile(handle, ALL_RESCORED_NAME, entriesToText(sortedEntries(buildMergedWordlist().entries)));
  await Disk.writeFile(handle, README_NAME, README_TEXT);
  const cache = {
    schemaVersion: SCHEMA_VERSION,
    sources: state.sources.map(serializeMetaEntry),
    scoring: state.scoring,
    scoringDirty: state.scoringDirty,
    mergedSettings: IdbBackend.readMergedSettings(),
  };
  await Disk.writeFile(handle, GRAWLIX_JSON_NAME, JSON.stringify(cache, null, 2));
  await Disk.saveHandle(handle);

  DiskBackend.attach(handle, cache);
  Storage = DiskBackend;
}

// ─── Workshop view ────────────────────────────────────────────────────────────
// Top-level page (peer of Library in the brand-bar nav). Hosts the tool gallery,
// stack, and entries table — the construction-aid surface. Owns the show/hide
// lifecycle plus the search / whole-word / score-range / sort state and its
// handlers, mirroring LibraryView's shape (self-contained module, no shared
// state object between the two views).

const WorkshopView = (() => {
  const el = document.getElementById('workshop-view');

  // View-private state. Read externally via the getters in the returned
  // object; written either through the handlers below or through
  // `applyURLState` (Router) / `restoreScoreRange` (boot). The sort state
  // is mutated by WorkshopEntriesScroller's toolbar via `setSort`.
  // Search query / whole-word are *not* here — they live in the permanent
  // Search bar's ToolStack row params; the getters below read them from it.
  let _scoreRange      = '';
  let _sortKey         = 'entry';
  let _sortDir         = 'asc';

  function show() {
    el.hidden = false;
    // Histogram rect positioning reads live offsetLeft/offsetWidth, which are
    // 0 while the card is hidden. Any rect write during hidden corrupts the
    // saved position; reposition now that the bars have real dimensions.
    repositionAllHistogramRects();
  }
  function hide() { el.hidden = true; }
  function isVisible() { return !el.hidden; }

  function onScoreRange(value) {
    _scoreRange = normalizeScoreRange(value, 'score-range-input');
    if (_scoreRange) lsSave('scoreRange', _scoreRange);
    else             lsDel('scoreRange');
    if (workshopScroller) workshopScroller.setScoreRange(_scoreRange);
    repositionAllHistogramRects();
  }
  // Sort state is mutated by WorkshopEntriesScroller's toolbar when the user
  // picks a new axis or flips the direction. No filter call here — the
  // scroller re-applies sort itself; this just keeps the canonical state.
  function setSort(key, dir) { _sortKey = key; _sortDir = dir; }

  // Bulk-apply URL sort state at boot. Router parses the query string, sets
  // the tool stack (including the Search bar row), then hands us the sort
  // axis/direction. The search query itself rides in the stack, not here.
  function applyURLState({ sortKey, sortDir }) {
    const tier = chainSortTier(ToolStack.getStack());
    _sortKey = sortKey || WORKSHOP_DEFAULT_SORT_BY_TIER[tier];
    _sortDir = sortDir || defaultSortDir(_sortKey);
    reconcileSort(ToolStack.getStack());
  }

  // Score-range is the lone state field that's localStorage-backed (it's a
  // standing preference, not a shared URL parameter — see design.md § Out of
  // scope for the URL). Boot restores the validated value via this setter.
  function restoreScoreRange(v) { _scoreRange = v; }

  return {
    show, hide, isVisible,
    onScoreRange,
    setSort, applyURLState, restoreScoreRange,
    get searchQuery()     { return ToolStack.getSearchBarRow().params.pattern || ''; },
    get scoreRange()      { return _scoreRange;      },
    get sortKey()         { return _sortKey;         },
    get sortDir()         { return _sortDir;         },
  };
})();

// ─── Library view ─────────────────────────────────────────────────────────────
// Top-level page (peer of Workshop in the brand-bar nav). Hosts the wordlist
// list and the focused-wordlist details pane.

const LibraryView = (() => {
  const el = document.getElementById('library-view');

  const onboarding = el.querySelector('#wld-onboarding');
  let _onboardingPage = lsLoad('onboarded')
    ? null
    : (parseInt(lsLoad('onboardingPage'), 10) || 1);

  function setOnboardingPage(page) {
    _onboardingPage = page;
    if (page === null) lsDel('onboardingPage');
    else               lsSave('onboardingPage', String(page));
  }

  function getXwiWordlist() {
    return state.sources.find(l => l.publisherId === 'xwi');
  }

  function buildOnboardingPageHTML(page) {
    const xwi = getXwiWordlist();
    const visiblePages = [1, 2];
    if (xwi && xwi.rawEntries.length === 0) visiblePages.push(3);
    const dots = visiblePages.map(n =>
      `<span${n === page ? ' class="active"' : ''}></span>`).join('');
    const dotsHTML = `<div class="wld-onboarding-dots">${dots}</div>`;

    if (page === 1) {
      return `
        <button class="dialog-close-btn" aria-label="Dismiss" data-onboard-action="dismiss">✕</button>
        <p>Some popular wordlists have been set up with suggested scoring rules.</p>
        <div class="wld-onboarding-actions">
          <button class="link-btn" data-onboard-action="blank">No thanks, remove them</button>
          <button class="primary" data-onboard-action="next">Sounds good</button>
        </div>
        ${dotsHTML}`;
    }
    if (page === 2) {
      return `
        <button class="dialog-close-btn" aria-label="Dismiss" data-onboard-action="dismiss">✕</button>
        <p>Got a personal wordlist? Import it into ${buildWordlistNameHTML(getEditsWordlist())}.</p>
        <div class="wld-onboarding-actions">
          <button class="link-btn" data-onboard-action="next">Skip</button>
          <button class="primary" data-onboard-action="import">Import…</button>
        </div>
        ${dotsHTML}`;
    }
    // page 3 — XWI
    return `
      <button class="dialog-close-btn" aria-label="Dismiss" data-onboard-action="dismiss">✕</button>
      <p>XWord Info subscriber? Import your ${buildWordlistNameHTML(getXwiWordlist())} wordlist.</p>
      <div class="wld-onboarding-actions">
        <button class="link-btn" data-onboard-action="next">Skip</button>
        <button class="primary" data-onboard-action="import">Import…</button>
      </div>
      ${dotsHTML}`;
  }

  function renderOnboarding() {
    if (_onboardingPage === null) { onboarding.hidden = true; return; }

    // Auto-advance: relevant wordlist already populated.
    if (_onboardingPage === 2 && (getEditsWordlist()?.rawEntries.length ?? 0) > 0) {
      setOnboardingPage(3);
    }
    // Page 3 requires XWI to exist and be unpopulated; otherwise end onboarding.
    if (_onboardingPage === 3) {
      const xwi = getXwiWordlist();
      if (!xwi || xwi.rawEntries.length > 0) {
        finishOnboarding();
        return;
      }
    }

    onboarding.hidden = false;
    onboarding.innerHTML = buildOnboardingPageHTML(_onboardingPage);
  }

  function finishOnboarding() {
    setOnboardingPage(null);
    onboarding.hidden = true;
    lsSave('onboarded', '1');
  }

  function advanceOnboarding() {
    if (_onboardingPage === 1)      setOnboardingPage(2);
    else if (_onboardingPage === 2) setOnboardingPage(3);
    else                            { finishOnboarding(); return; }
    renderOnboarding();
  }

  async function onboardingGoBlank() {
    // Invalidate every wordlist's caches first so the cosmetic effect that
    // fires on the `state.sources = …` assignment doesn't read a stale
    // merged cache (whether the wordlist is being removed or just having its
    // rules cleared).
    state.sources.forEach(l => invalidateWordlistCaches(l));
    const edits = getEditsWordlist();
    const toRemove = state.sources.filter(l => l !== edits);
    state.sources = [edits];
    state.scoring = [];
    edits.rescoreRules = [];
    recomputeUncovered(edits);
    persistMeta();
    persistScoring();
    await Promise.all(toRemove.map(l => Storage.deleteWordlist(l)));
    renderAll();
    advanceOnboarding();
  }

  function openOnboardingImport() {
    const target = _onboardingPage === 2 ? getEditsWordlist() : getXwiWordlist();
    if (!target) { advanceOnboarding(); return; }
    ImportGuideDialog.open(target);
    // A successful import inside the dialog calls ingestFile, which triggers
    // renderAll → renderOnboarding, auto-advancing once the import lands.
  }

  onboarding.addEventListener('click', e => {
    const action = e.target.closest('[data-onboard-action]')?.dataset.onboardAction;
    if (action === 'dismiss')     finishOnboarding();
    else if (action === 'next')   advanceOnboarding();
    else if (action === 'blank')  onboardingGoBlank();
    else if (action === 'import') openOnboardingImport();
  });

  const listBody = el.querySelector('#wld-list-body');
  const pane     = el.querySelector('#wld-pane');
  const addBtn   = el.querySelector('#wld-add-wordlist');

  let _focusedWordlist = null;
  let _dateTimer   = null;

  // Library-only view state — never persisted, never URL-routed. Survives
  // across wordlist switches inside a session so the user's last search
  // and sort stick around while they explore.
  let _displayMode      = 'rescored';  // 'rescored' | 'original'
  let _searchQuery      = '';
  let _searchWholeWord  = false;
  let _sortKey          = 'entry';
  let _sortDir          = 'asc';
  let _entriesScroller  = null;

  let _scoreRanges = null;
  function loadScoreRanges() {
    if (_scoreRanges) return _scoreRanges;
    try { _scoreRanges = JSON.parse(lsLoad('libScoreRanges')) || {}; }
    catch { _scoreRanges = {}; }
    return _scoreRanges;
  }
  function scoreRangeKey(target, mode) {
    if (target === MERGED_ID) return 'merged';
    return `${target.dbKey}:${mode}`;
  }
  function getScoreRangeFor(target, mode) {
    const v = loadScoreRanges()[scoreRangeKey(target, mode)] || '';
    return v && parseRange(v) ? v : '';
  }
  function setScoreRangeFor(target, mode, value) {
    const ranges = loadScoreRanges();
    const k = scoreRangeKey(target, mode);
    if (value) ranges[k] = value;
    else       delete ranges[k];
    if (Object.keys(ranges).length === 0) lsDel('libScoreRanges');
    else                                  lsSave('libScoreRanges', JSON.stringify(ranges));
  }
  function activeScoreRange() {
    if (!_focusedWordlist) return '';
    return getScoreRangeFor(_focusedWordlist, _displayMode);
  }

  // ── HTML builders for pane internals ────────────────────────────────────────

  function buildModeToggleHTML() {
    return `<div class="seg-ctrl" role="group" aria-label="Display mode">
      <button type="button" class="seg-btn${_displayMode === 'rescored' ? ' active' : ''}" data-mode="rescored" onclick="LibraryView.setMode('rescored')">Rescored</button>
      <button type="button" class="seg-btn${_displayMode === 'original' ? ' active' : ''}" data-mode="original" onclick="LibraryView.setMode('original')">Original</button>
    </div>`;
  }

  function buildSearchBarHTML() {
    const vals = { pattern: _searchQuery, 'whole-word': _searchWholeWord };
    const parts = buildToolRowPartsHTML(TOOLS.search.params.filter(p => p.key !== 'replace'), vals, 'search', p =>
      p.key === 'pattern'
        ? ` id="lib-search-input" title="Search (Alt-S)" oninput="LibraryView.onSearch(this.value)"`
        : ` id="lib-search-whole-word" onchange="LibraryView.onWholeWord(this.checked)"`);
    return `<div class="search-bar lib-search-bar">
      ${buildToolLabelHTML({ icon: '<svg width="16" height="16" aria-hidden="true"><use href="#icon-search"/></svg>', name: 'Search' })}
      ${parts.main}
      ${parts.asides}
    </div>`;
  }

  function buildSortControlsHTML() {
    const arrow = _sortDir === 'asc' ? '↑' : '↓';
    const options = Object.entries(LIBRARY_SORT_AXES)
      .map(([key, { label }]) => `<option value="${key}"${key === _sortKey ? ' selected' : ''}>${esc(label)}</option>`)
      .join('');
    return `Sort by
      <select class="sort-axis-select" onchange="LibraryView.onSortAxis(this.value)">${options}</select>
      <button class="sort-dir-btn" type="button" title="Toggle direction" aria-label="Toggle direction" onclick="LibraryView.toggleSortDir()">${arrow}</button>`;
  }

  function buildEntriesPanelHTML() {
    return `<div class="lib-entries-panel"><div class="lib-entries-host" id="lib-entries-host"></div></div>`;
  }

  // ── Rendering ─────────────────────────────────────────────────────────────────

  function renderList() {
    if (!_sourceCountsCache) _sourceCountsCache = buildMergedWordlist().sourceCounts;
    const contribMap = new Map(_sourceCountsCache.map(s => [s.wordlist, s.count]));

    const mergedCard = buildMergedCardHTML(_focusedWordlist === MERGED_ID, allSeverity());
    const sourceCards = state.sources.map(wordlist => {
      const icon = getWordlistIcon(wordlist);
      const meta = wordlistCardMeta(wordlist, contribMap);
      const severity = wordlistSeverity(wordlist);
      return buildWordlistCardHTML(icon, wordlist.name, meta, {
        selected:      _focusedWordlist === wordlist,
        enabled:       wordlist.enabled,
        populated:     wordlist.populated,
        severity,
        severityTitle: severityTitle(severity),
      });
    });
    listBody.innerHTML = [
      `<div class="wld-list-section-header">Merged</div>`,
      mergedCard,
      `<div class="wld-list-section-header">Sources</div>`,
      ...sourceCards,
    ].join('');

    const cards = listBody.querySelectorAll('.wordlist-card[data-wordlist]');
    state.sources.forEach((wordlist, i) => { if (cards[i]) cards[i]._wordlist = wordlist; });

    publishStickyCardHeight();
  }

  // In the narrow stacked layout the selected card pins to the top (see the
  // `display: contents` rule on the rail). Publish its measured height so
  // the pane's own sticky bars can offset cleanly below it.
  function publishStickyCardHeight() {
    const selCard = listBody.querySelector('.wordlist-card.selected');
    if (selCard) {
      document.documentElement.style.setProperty('--wld-pin-h', selCard.offsetHeight + 'px');
    }
  }

  function buildPane() {
    if (_dateTimer) { clearInterval(_dateTimer); _dateTimer = null; }
    destroyScroller();

    if (!_focusedWordlist) {
      pane.innerHTML = '<div class="wld-pane-empty">Select a wordlist to configure</div>';
      return;
    }
    if (_focusedWordlist === MERGED_ID) {
      renderMergedPane();
      return;
    }
    const wordlist = _focusedWordlist;
    const isEdits = wordlist.type === 'edits';
    const hasData = wordlist.rawEntries.length > 0;
    const hasRules = !isEdits && (wordlist.rescoreRules?.length ?? 0) > 0;

    const useOriginal = _displayMode === 'original';
    const sourceEntries = (isEdits || useOriginal) ? wordlist.rawEntries : getRescoredEntries(wordlist);
    const ignoredCount = (isEdits || useOriginal) ? 0 : wordlist.rawEntries.length - sourceEntries.length;
    const intervals = parseRange(activeScoreRange());
    const filteredEntries = intervals ? sourceEntries.filter(e => matchesRange(e.score, intervals)) : sourceEntries;
    const stats = computeStatsRaw(filteredEntries, intervals ? 0 : ignoredCount);

    // Action row shape is unified across all wordlists: date slot, primary
    // action, optional mode toggle (sources only), Download, more menu. The
    // toggle governs stats, histogram, entries view, and what Download
    // produces — a single coupled "what version am I working with" knob.
    let actionBtn, dlBtn, moreMenu;
    if (isEdits) {
      actionBtn = `<button class="${hasData ? '' : 'primary'}" onclick="LibraryView.action('import')" ${wordlist._loading ? 'disabled' : ''}>${wordlist._loading ? 'Importing…' : 'Import'}</button>`;
      dlBtn = hasData ? `<button class="primary" onclick="LibraryView.action('download')">Download</button>` : '';
      moreMenu = hasData ? buildMoreMenuHTML([
        ['Clear', `LibraryView.action('clear')`],
      ]) : '';
    } else {
      const showBadge = wordlist._updateAvailable && !wordlist._loading;
      const dot = showBadge ? `&nbsp;${buildBadgeHTML('info')}` : '';
      const updateTitle = showBadge ? 'Update available' : '';
      const label = hasData ? 'Update' : (wordlist.url ? 'Fetch' : 'Import');

      if (wordlist.url) {
        const btnLabel = `${label}${dot}`;
        actionBtn = buildSplitBtn(btnLabel, `LibraryView.action('fetch')`,
          [['Import', `LibraryView.action('import')`]],
          { primary: true, disabled: !!wordlist._loading, title: updateTitle });
      } else {
        actionBtn = `<button class="primary"${updateTitle ? ` title="${updateTitle}"` : ''} onclick="LibraryView.action('import')" ${wordlist._loading ? 'disabled' : ''}>${wordlist._loading ? 'Importing…' : 'Import'}${dot}</button>`;
      }

      dlBtn = hasData ? `<button class="primary" onclick="LibraryView.action('download')">Download</button>` : '';

      moreMenu = buildMoreMenuHTML([
        ['Configure', `LibraryView.action('configure')`],
        ['Delete',    `LibraryView.action('delete')`],
      ]);
    }

    // Mode toggle: only meaningful when there are rules to apply.
    const toggleHTML = (hasData && hasRules) ? buildModeToggleHTML() : '';
    const dateSlot = (hasData && wordlist.lastUpdated) ? '<span class="detail-date"></span>' : '';
    // Toggle on the left (when present); date + buttons on the right.
    const actionsHTML = [toggleHTML, dateSlot, actionBtn, dlBtn, moreMenu].filter(Boolean).join('\n');

    const rulesHTML = isEdits
      ? `<div class="wld-pane-rescore" id="wld-scoring-section">${buildScoringSectionHTML()}</div>`
      : `<div class="wld-pane-rescore" id="wld-rescore-section">${buildRescoreSectionHTML(wordlist)}</div>`;

    pane.innerHTML = `
      <div class="wld-pane-header">
        <div class="wld-pane-actions">${actionsHTML}</div>
      </div>
      ${rulesHTML}
      ${buildSearchBarHTML()}
      ${buildLibraryStatsBarHTML(stats, sourceEntries, ignoredCount)}
      ${hasData ? buildEntriesPanelHTML() : ''}`;

    if (hasData) buildScrollerInPane(wordlist);

    if (hasData && wordlist.lastUpdated) {
      const setDate = () => {
        const dEl = pane.querySelector('.detail-date');
        if (!dEl) return;
        dEl.textContent = `Last updated ${timeAgo(wordlist.lastUpdated)}`;
        dEl.title = new Date(wordlist.lastUpdated).toLocaleString();
      };
      setDate();
      _dateTimer = setInterval(setDate, 60_000);
    }
  }

  function renderPane() {
    buildPane();
    attachHelpPopups();
    publishLibraryBarHeights();
    repositionAllHistogramRects();
  }

  // The All panel: a single Download button, merged stats + histogram, the
  // scoring (tier-label) rules editor, and a search-filtered view of the
  // merged entries. No Rescored/Original toggle — the merged view is the
  // synthesis of already-rescored sources; "Original" has no referent here.
  function renderMergedPane() {
    const { entries } = buildMergedWordlist();
    const intervals = parseRange(activeScoreRange());
    const filteredEntries = intervals ? entries.filter(e => matchesRange(e.score, intervals)) : entries;
    const stats = intervals ? computeStatsRaw(filteredEntries) : computeStats(_mergedStatsKey, entries);
    const hasData = entries.length > 0;
    const dlBtn = hasData ? `<button class="primary" onclick="LibraryView.action('download')">Download</button>` : '';

    pane.innerHTML = `
      <div class="wld-pane-header">
        <div class="wld-pane-actions">${dlBtn}</div>
      </div>
      <div class="wld-pane-rescore" id="wld-scoring-section">${buildScoringSectionHTML()}</div>
      ${buildSearchBarHTML()}
      ${buildLibraryStatsBarHTML(stats, entries, 0)}
      ${hasData ? buildEntriesPanelHTML() : ''}`;

    if (hasData) buildScrollerInPane(null);
  }

  function buildLibraryStatsBarHTML(stats, histEntries, ignoredCount) {
    const range = activeScoreRange();
    return buildStatsBarHTML(stats, { entries: histEntries, ignoredCount }, getHistogramLayout(), {
      scoreRange: { value: range, inputId: 'lib-score-range-input', viewName: 'LibraryView' },
      sortHTML: buildSortControlsHTML(),
    });
  }

  function buildScrollerInPane(wordlist) {
    const host = pane.querySelector('#lib-entries-host');
    if (!host) return;
    _entriesScroller = new LibraryEntriesScroller(host, {
      wordlist,
      mode: _displayMode,
      query: _searchQuery,
      wholeWord: _searchWholeWord,
      sortKey: _sortKey,
      sortDir: _sortDir,
      scoreRange: activeScoreRange(),
    });
  }

  function destroyScroller() {
    _entriesScroller?.destroy();
    _entriesScroller = null;
  }

  function refreshStatsBar() {
    if (!_focusedWordlist) return;
    const isMerged = _focusedWordlist === MERGED_ID;
    let sourceEntries, ignoredCount;
    if (isMerged) {
      sourceEntries = buildMergedWordlist().entries;
      ignoredCount = 0;
    } else {
      const wordlist = _focusedWordlist;
      const useOriginal = _displayMode === 'original';
      sourceEntries = useOriginal ? wordlist.rawEntries : getRescoredEntries(wordlist);
      ignoredCount = useOriginal ? 0 : wordlist.rawEntries.length - sourceEntries.length;
    }
    const intervals = parseRange(activeScoreRange());
    const searchEntries = applyLibrarySearchFilter(sourceEntries);
    const rangeFiltered = intervals ? searchEntries.filter(e => matchesRange(e.score, intervals)) : searchEntries;
    const stats = computeStatsRaw(rangeFiltered, intervals ? 0 : ignoredCount);
    const statsBar = pane.querySelector('.stats-bar');
    if (statsBar) {
      swapStatsBarReadouts(statsBar, buildLibraryStatsBarHTML(stats, searchEntries, ignoredCount));
      repositionAllHistogramRects();
    }
  }

  function applyLibrarySearchFilter(entries) {
    const q = _searchQuery.trim();
    if (!q) return entries;
    const matcher = buildSearchPattern(q, _searchWholeWord);
    if (!matcher) return entries;
    return entries.filter(e => matcher.test(displayOf(e)));
  }

  function refresh() {
    if (el.hidden) return;
    if (_focusedWordlist && _focusedWordlist !== MERGED_ID && !state.sources.includes(_focusedWordlist)) {
      _focusedWordlist = MERGED_ID;
    }
    renderOnboarding();
    renderList();
    renderPane();
  }

  function focus(target) {
    _focusedWordlist = target;
    renderList();
    renderPane();
  }

  // ── Actions (called from inline onclick handlers in pane HTML) ───────────────

  const ACTIONS = {
    fetch:     () => fetchWordlist(_focusedWordlist),
    import:    () => importToWordlist(_focusedWordlist),
    delete:    async () => { await deleteWordlist(_focusedWordlist); },
    configure: () => ConfigureWordlistDialog.open(_focusedWordlist),
    clear:     () => clearEdits(),
    // Single Download: routes by focused wordlist + display mode. The
    // Rescored/Original toggle decides which version a source produces.
    download:  () => {
      if (_focusedWordlist === MERGED_ID) return downloadMergedWordlistFromPanel();
      if (_focusedWordlist?.type === 'edits') return downloadEdits();
      return _displayMode === 'original'
        ? downloadOriginalWordlist(_focusedWordlist)
        : downloadIndividualWordlistRescored(_focusedWordlist);
    },
  };

  function action(name) {
    const fn = ACTIONS[name];
    if (fn) fn();
  }

  // ── Search / sort / mode handlers (inline onclick/oninput → here) ────────────

  function setMode(mode) {
    if (mode !== 'rescored' && mode !== 'original') return;
    if (_displayMode === mode) return;
    _displayMode = mode;
    pane.querySelectorAll('.seg-ctrl .seg-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    refreshScoreRangeInput();
    refreshStatsBar();
    _entriesScroller?.setMode(mode);
    _entriesScroller?.setScoreRange(activeScoreRange());
  }

  function refreshScoreRangeInput() {
    const inp = document.getElementById('lib-score-range-input');
    if (!inp) return;
    const range = activeScoreRange();
    inp.value = range;
    inp.classList.remove('invalid');
    syncClearButton(inp);
  }

  function onScoreRange(value) {
    if (!_focusedWordlist) return;
    const next = normalizeScoreRange(value, 'lib-score-range-input');
    setScoreRangeFor(_focusedWordlist, _displayMode, next);
    refreshStatsBar();
    _entriesScroller?.setScoreRange(next);
  }

  function onSearch(value) {
    _searchQuery = value || '';
    _entriesScroller?.setQuery(_searchQuery, _searchWholeWord);
    refreshStatsBar();
  }

  function onWholeWord(checked) {
    _searchWholeWord = !!checked;
    _entriesScroller?.setQuery(_searchQuery, _searchWholeWord);
    refreshStatsBar();
  }

  function onSortAxis(key) {
    if (!LIBRARY_SORT_AXES[key] || _sortKey === key) return;
    _sortKey = key;
    _sortDir = defaultSortDir(key);
    refreshSortControls();
    _entriesScroller?.setSort(_sortKey, _sortDir);
  }

  function toggleSortDir() {
    _sortDir = _sortDir === 'asc' ? 'desc' : 'asc';
    refreshSortControls();
    _entriesScroller?.setSort(_sortKey, _sortDir);
  }

  function refreshSortControls() {
    const slot = pane.querySelector('.stats-bar-sort');
    if (slot) slot.innerHTML = buildSortControlsHTML();
  }

  // Called from updateRescorePreview as the user types in the rules editor.
  // Applies uncommitted rules to the entries view so rule tuning is live.
  function previewRescoreRules(rules) {
    if (!_entriesScroller) return;
    if (_focusedWordlist === MERGED_ID) return;
    _entriesScroller.setRescorePreview(rules);
  }

  function startCardRename(wordlist) {
    if (!wordlist) return;
    const card = [...listBody.querySelectorAll('.wordlist-card[data-wordlist]')].find(c => c._wordlist === wordlist);
    const nameEl = card?.querySelector('.card-name');
    if (!nameEl || nameEl.querySelector('input')) return;
    const originalName = wordlist.name;
    nameEl.textContent = '';
    const input = document.createElement('input');
    input.className = 'card-name-edit';
    input.value = originalName;
    nameEl.appendChild(input);
    input.focus();
    input.select();
    input.onclick = e => e.stopPropagation();
    startInlineRename(input, originalName, {
      onCommit(newName) {
        setWordlistName(wordlist, newName);
        nameEl.textContent = newName;
      },
      onCancel() {
        nameEl.textContent = originalName;
      },
    });
  }

  // ── List event delegation ─────────────────────────────────────────────────────

  listBody.addEventListener('click', e => {
    if (e.target.closest('.wordlist-card[data-merged]')) {
      focus(MERGED_ID);
      return;
    }
    const toggleLabel = e.target.closest('label.toggle');
    if (toggleLabel) {
      const card = toggleLabel.closest('.wordlist-card[data-wordlist]');
      if (card?._wordlist && !card._wordlist.populated) {
        e.stopPropagation();
        triggerImportForWordlist(card._wordlist, e);
      }
      return;
    }
    const card = e.target.closest('.wordlist-card[data-wordlist]');
    if (!card?._wordlist) return;
    focus(card._wordlist);
  });

  listBody.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.target.closest('.wordlist-card[data-merged]')) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        focus(MERGED_ID);
      }
      return;
    }
    const card = e.target.closest('.wordlist-card[data-wordlist]');
    if (!card?._wordlist) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      focus(card._wordlist);
    } else if (e.key === 'F2') {
      e.preventDefault();
      startCardRename(card._wordlist);
    }
  });

  listBody.addEventListener('change', e => {
    const toggle = e.target.closest('.toggle input[type="checkbox"]');
    if (!toggle) return;
    const card = toggle.closest('.wordlist-card[data-wordlist]');
    if (!card?._wordlist) return;
    toggleWordlist(card._wordlist, e);
  });

  // Drag-to-reorder (mouse)
  let _dragWordlist = null;
  listBody.addEventListener('dragstart', e => {
    const card = e.target.closest('.wordlist-card[data-wordlist]');
    if (!card?._wordlist) return;
    _dragWordlist = card._wordlist;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', '');
    e.dataTransfer.setDragImage(card, 0, 0);
    setTimeout(() => card.classList.add('dragging'), 0);
  });
  listBody.addEventListener('dragend', () => {
    listBody.querySelectorAll('.wordlist-card.dragging, .wordlist-card.drag-over')
      .forEach(c => c.classList.remove('dragging', 'drag-over'));
    _dragWordlist = null;
  });
  listBody.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const card = e.target.closest('.wordlist-card[data-wordlist]');
    if (!card || card._wordlist === _dragWordlist) return;
    listBody.querySelectorAll('.wordlist-card.drag-over').forEach(c => c.classList.remove('drag-over'));
    card.classList.add('drag-over');
  });
  listBody.addEventListener('dragleave', e => {
    const card = e.target.closest('.wordlist-card');
    if (card && !card.contains(e.relatedTarget)) card.classList.remove('drag-over');
  });
  listBody.addEventListener('drop', e => {
    e.preventDefault();
    const card = e.target.closest('.wordlist-card[data-wordlist]');
    const toWordlist = card?._wordlist;
    if (!_dragWordlist || !toWordlist || _dragWordlist === toWordlist) return;
    const fromIdx = state.sources.indexOf(_dragWordlist);
    const toIdx   = state.sources.indexOf(toWordlist);
    reorderSources(fromIdx, toIdx);
  });

  // ── + Add wordlist ────────────────────────────────────────────────────────────────

  addBtn.addEventListener('click', () => ConfigureWordlistDialog.openAdd());

  // ── Show / hide ───────────────────────────────────────────────────────────────

  function show(target = null) {
    _focusedWordlist = target ?? _focusedWordlist ?? MERGED_ID;
    el.hidden = false;
    renderOnboarding();
    renderList();
    renderPane();
    repositionAllHistogramRects();
  }

  function hide() {
    if (_dateTimer) { clearInterval(_dateTimer); _dateTimer = null; }
    destroyScroller();
    el.hidden = true;
  }

  function getFocusedWordlist() { return _focusedWordlist; }

  // In-place so a pending edit isn't wiped out mid-keystroke.
  function refreshRescoreSection() {
    const section = el.querySelector('#wld-rescore-section');
    if (section) section.innerHTML = buildRescoreSectionHTML(_focusedWordlist);
  }

  function refreshScoringSection() {
    const section = el.querySelector('#wld-scoring-section');
    if (section) section.innerHTML = buildScoringSectionHTML();
  }

  // Update the "X used" meta text on each wordlist card in place. Avoids rebuilding
  // the whole list (which would lose drag/hover state mid-interaction).
  function updateListMeta(contribMap) {
    for (const card of listBody.querySelectorAll('.wordlist-card[data-wordlist]')) {
      const wordlist = card._wordlist;
      if (!wordlist) continue;
      const metaEl = card.querySelector('.card-meta');
      if (metaEl) metaEl.textContent = wordlistCardMeta(wordlist, contribMap);
    }
    const mergedMetaEl = listBody.querySelector('.wld-merged-card .card-meta');
    if (mergedMetaEl) mergedMetaEl.textContent = pluralize(buildMergedWordlist().entries.length, 'entry', 'entries');
  }

  return {
    show, hide, refresh, focus, action, getFocusedWordlist,
    refreshRescoreSection, refreshScoringSection, updateListMeta,
    isVisible: () => !el.hidden,
    setMode, onSearch, onWholeWord, onSortAxis, toggleSortDir, onScoreRange,
    get scoreRange() { return activeScoreRange(); },
    previewRescoreRules,

})();

// ─── Main view nav (Workshop / Library) ──────────────────────────────────────
// Switches the active top-level page. Treats Workshop and Library as peers —
// each owns its own show/hide lifecycle; this just routes the choice to them
// and updates the brand-bar nav state.

const MainView = (() => {
  // Adding a new top-level view: register it here and add a matching
  // `.header-nav-item[data-view="…"]` button. The Router picks up the route
  // automatically — see docs/design.md § URL state.
  const VIEWS = { workshop: WorkshopView, library: LibraryView };
  const DEFAULT_VIEW = 'workshop';
  const navButtons = document.querySelectorAll('.header-nav-item[data-view]');
  const navEl = document.querySelector('.header-nav');
  const navTrigger = navEl.querySelector('.header-nav-trigger');
  const navTriggerIcon = navTrigger.querySelector('.header-nav-trigger-icon use');
  const navTriggerLabel = navTrigger.querySelector('.header-nav-trigger-label');
  const scrollEl = document.scrollingElement;
  let _current = DEFAULT_VIEW;
  // Per-view scroll positions. Both views scroll the same document, so
  // toggling `hidden` would otherwise clamp scrollTop to whichever view is
  // shorter and lose the user's place when they tab back.
  const _scrollByView = Object.create(null);

  function activate(view, target = null) {
    if (!VIEWS[view]) view = DEFAULT_VIEW;
    const changed = view !== _current;
    if (changed) _scrollByView[_current] = scrollEl.scrollTop;
    _current = view;
    for (const [name, ctrl] of Object.entries(VIEWS)) {
      if (name === view) ctrl.show(target);
      else               ctrl.hide();
    }
    let activeBtn = null;
    for (const btn of navButtons) {
      const match = btn.dataset.view === view;
      btn.classList.toggle('active', match);
      if (match) { btn.setAttribute('aria-current', 'page'); activeBtn = btn; }
      else        btn.removeAttribute('aria-current');
    }
    if (activeBtn) {
      navTriggerIcon.setAttribute('href', activeBtn.querySelector('use').getAttribute('href'));
      navTriggerLabel.textContent = activeBtn.textContent.trim();
    }
    // Restore after show() so the new view's content has been laid out and
    // the document is tall enough to accept the saved scrollTop. Skip on
    // the initial activate so a URL-driven jump (if any) isn't clobbered.
    if (changed) scrollEl.scrollTop = _scrollByView[view] ?? 0;
    Router.navigate();
  }

  function pickBadgedWordlist() {
    let best = null;
    let bestPri = 0;
    const consider = (target, severity) => {
      const p = SEVERITY_PRIORITY[severity] ?? 0;
      if (p > bestPri) { best = target; bestPri = p; }
    };
    const allSev = allSeverity();
    if (allSev) consider(MERGED_ID, allSev);
    for (const wordlist of state.sources) {
      const sev = wordlistSeverity(wordlist);
      if (sev) consider(wordlist, sev);
    }
    return best;
  }

  function closeNav() {
    if (!navEl.classList.contains('open')) return;
    navEl.classList.remove('open');
    navTrigger.setAttribute('aria-expanded', 'false');
    document.removeEventListener('click', onOutsideNavClick);
  }
  function onOutsideNavClick(e) {
    if (!navEl.contains(e.target)) closeNav();
  }
  navTrigger.addEventListener('click', () => {
    if (navEl.classList.contains('open')) { closeNav(); return; }
    navEl.classList.add('open');
    navTrigger.setAttribute('aria-expanded', 'true');
    document.addEventListener('click', onOutsideNavClick);
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNav(); });

  for (const btn of navButtons) {
    btn.addEventListener('click', () => {
      const view = btn.dataset.view;
      // Re-clicking the active nav scrolls back to the top — a common
      // affordance and an easy way to bail out of a long scroll.
      if (view === _current) scrollEl.scrollTo({ top: 0, behavior: 'smooth' });
      else                   activate(view, view === 'library' ? pickBadgedWordlist() : null);
      closeNav();
    });
  }

  function syncTriggerBadge() {
    let bestSev = null, bestPri = 0, bestTitle = '';
    for (const btn of navButtons) {
      const b = btn.querySelector(':scope > .badge');
      if (!b) continue;
      const pri = SEVERITY_PRIORITY[b.dataset.severity] ?? 0;
      if (pri > bestPri) { bestPri = pri; bestSev = b.dataset.severity; bestTitle = b.title; }
    }
    let tb = navTrigger.querySelector(':scope > .badge');
    if (bestSev) {
      if (!tb) {
        tb = document.createElement('span');
        tb.className = 'badge';
        navTrigger.appendChild(tb);
      }
      tb.dataset.severity = bestSev;
      if (bestTitle) tb.title = bestTitle;
      else tb.removeAttribute('title');
    } else if (tb) {
      tb.remove();
    }
  }

  function setSeverityBadge(view, severity, title = '') {
    const btn = [...navButtons].find(b => b.dataset.view === view);
    if (!btn) return;
    let badge = btn.querySelector(':scope > .badge');
    if (severity) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'badge';
        btn.appendChild(badge);
      }
      badge.dataset.severity = severity;
      if (title) badge.title = title;
      else badge.removeAttribute('title');
    } else if (badge) {
      badge.remove();
    }
    syncTriggerBadge();
  }

  // The HTML body's initial state matches DEFAULT_VIEW (Workshop visible,
  // Library hidden). init() calls activate() with the URL-derived view after
  // Router.applyURL() so the JS is the source of truth from that point on.

  return {
    activate,
    getCurrent: () => _current,
    getDefault: () => DEFAULT_VIEW,
    hasView: name => Object.hasOwn(VIEWS, name),
    setSeverityBadge,
  };
})();

let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredInstallPrompt = e;
});
window.addEventListener('appinstalled', () => { _deferredInstallPrompt = null; });

function isInstalled() {
  return window.matchMedia('(display-mode: standalone)').matches;
}

function canInstall() { return _deferredInstallPrompt !== null; }

async function tryInstall() {
  if (!_deferredInstallPrompt) return false;
  _deferredInstallPrompt.prompt();
  const { outcome } = await _deferredInstallPrompt.userChoice;
  _deferredInstallPrompt = null;
  return outcome === 'accepted';

function wordlistFromMeta(m, text) {
  const wordlist = wrapWordlist({
    ...(m.type     ? { type: m.type }         : {}),
    dbKey:         m.dbKey || newDbKey(),
    ...(m.filename ? { filename: m.filename } : {}),
    icon:            m.icon || null,
    publisherId:     m.publisherId || null,
    name: m.name, url: m.url || null,
    enabled: !!m.enabled,
    populated: !!(m.populated || m.type === 'edits' || text || m.lastUpdated),
    lastUpdated: m.lastUpdated || null,
    fetchedSize: m.fetchedSize || null,
    rescoreRules: (m.rescoreRules || []).map(r => ({ length: '', ...r })),
    dirty: !!m.dirty,
    originalFilename: m.originalFilename || null,
    ...(m.downloadCase ? { downloadCase: m.downloadCase } : {}),
    ...(m.downloadExt  ? { downloadExt:  m.downloadExt  } : {}),
    ...(m.downloadStem ? { downloadStem: m.downloadStem } : {}),
    rawEntries: text ? parseWordlist(text) : [],
    _loading: false,
  });
  recomputeUncovered(wordlist);
  return wordlist;
}

// ─── Init ─────────────────────────────────────────────────────────────────────

async function init() {
  const storedSchema = Storage.schemaVersion();
  const hasOldData   = Storage.hasData();
  if (hasOldData && storedSchema !== SCHEMA_VERSION) {
    const reset = await showConfirm(
      `Grawlix's data format has changed since your last visit. The site may not work correctly until reset.`,
      { confirmText: 'Reset', cancelText: 'I\'ll take my chances' }
    );
    if (reset) {
      await resetAllDataAndReload();
    }
  } else if (!hasOldData) {
    Storage.setSchemaVersion(SCHEMA_VERSION);
  }

  await openDB();

  const boot = await attemptDiskBoot();
  if (boot.mode === 'disk') {
    DiskBackend.attach(boot.handle, boot.cache);
    Storage = DiskBackend;
    DiskWatcher.start();
  } else if (boot.mode === 'session') {
    Storage = NullBackend;
    SessionPausedBanner.show();
  }

  const meta = Storage.readMeta();
  if (meta) {
    try {
      state.sources = await Promise.all(meta.map(async m => {
        const m2 = { ...m, dbKey: m.dbKey || newDbKey() };
        const text = await Storage.readWordlist(m2) ?? await idbGet('data_' + m.id);
        return wordlistFromMeta(m2, text);
      }));
    } catch { state.sources = defaultSources(); }
  } else {
    state.sources = defaultSources();
    persistMeta();
  }

  // Score filter persists across visits — see docs/design.md § Out of scope
  // for the URL. Validate the stored value; drop silently if corrupt.
  const storedScoreRange = lsLoad('scoreRange');
  if (storedScoreRange !== null && parseRange(storedScoreRange.trim()) !== null) {
    WorkshopView.restoreScoreRange(storedScoreRange.trim());
  }

  const initialView = Router.applyURL();

  ensureScoring();
  ensureEdits();
  propagateDefaults();
  MainView.activate(initialView);
  renderAll();
  await _firstPaint;
  const _overlay = document.getElementById('busy-overlay');
  if (_overlay) {
    _overlay.classList.add('done');
    _overlay.addEventListener('transitionend', () => _overlay.remove(), { once: true });
  }
  bindEvents();
  refreshStorageButton();
  checkForUpdates();
  setInterval(checkForUpdates, UPDATE_CHECK_INTERVAL);

  state.sources
    .filter(l => l.url && !l.populated)
    .forEach(l => fetchWordlist(l, null, { silent: true }));

  loadUnigramCorpus().catch(() => { /* surfaced when the tool is used */ });
}

function defaultSources() {
  return WORDLIST_PUBLISHERS.map(t => {
    const wordlist = wrapWordlist({
      dbKey: newDbKey(),
      icon: t.icon ? { ...t.icon } : null,
      publisherId: t.id,
      name: t.name,
      url: t.url || null,

      populated: false,
      rawEntries: [],
      lastUpdated: null,
      _loading: false,
      rescoreRules: t.defaultRules ? JSON.parse(JSON.stringify(t.defaultRules)) : [],
    });

}

function entriesToText(entries) {

function sortedEntries(entries) {
