<!-- Prevents FOUC: must run synchronously before first paint. -->
<script>
  const LS_PREFIX = 'grawlix_';
  const _dm    = localStorage.getItem(LS_PREFIX + 'darkMode');
  const _dark  = _dm === 'dark' || (_dm !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.add(_dark ? 'dark-mode' : 'light-mode');
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
input[type="file"] { display: none; }

:root {
  --accent:      #7b6db8;
  --accent-hover:#6558a0;
  --hdr-bg:      var(--accent);
  --hdr-bg-dark: color-mix(in srgb, var(--hdr-bg) 75%, black);
  --font-sans:   system-ui, -apple-system, sans-serif;
  --font-mono:   ui-monospace, 'Cascadia Mono', monospace;
  /* Stats-bar natural height: 36px histogram + 10px×2 padding + 1px border.
     Used as the sticky top-offset for whatever pins immediately below it
     (Workshop's entry headers, Library's entries). Stable as long as the
     histogram height is fixed. */
  --stats-bar-h: 57px;
  --tool-stack-h: 53px;
  --sticky-stack-h: 138px;
  --search-bar-h: 51px;
  /* Live height of the Library's pinned wordlist card (narrow layout) —
     published by LibraryView, used to offset the pane's sticky bars below
     it. The value here is just a pre-measurement fallback. */
  --wld-pin-h: 56px;
  --header-h: 84px;
}
html.dark-mode {
  color-scheme: dark;
  --bg:        #282828;
  --surface:   #232323;
  --border:    #525252;
  --border2:   #3e3e3e;
  --border3:   #3a3a3a;
  --text:      #e0e0e0;
  --muted:     #a0a0a0;
  --faint:     #6c6c6c;
  --hover:     #303030;
  --sel:       #383838;
  --row-hover: #2c2c2c;
  --input-bg:  #2e2e2e;
  --btn-bg:    #363636;
  --error-bg:  #361818;
  --del-hover: #361818;
  --shadow:    0 8px 40px rgba(0,0,0,0.5);
  --backdrop:  rgba(0,0,0,0.5);
  --score-0-bg: #3a0f0f; --score-0-fg: #e8a8a8;
  --score-1-bg: #6b1d1d; --score-1-fg: #fdd8d8;
  --score-2-bg: #6b3d00; --score-2-fg: #fddcaa;
  --score-3-bg: #615b0d; --score-3-fg: #fef7c0;
  --score-4-bg: #2a6b42; --score-4-fg: #d4f9e5;
  --score-5-bg: #1e4a8f; --score-5-fg: #cce4ff;
  --callout-bg: #201d09; --callout-border: #3d3410; --callout-fg: #b09840;
  --usd-added-bg:    #1a3d2a; --usd-added-fg:    #6ee89a;
  --usd-deleted-bg:  #3d1a1a; --usd-deleted-fg:  #f07070;
  --usd-rescored-bg: #2a2a2a; --usd-rescored-fg: #909090;
  --ok-fg: #6ee89a; --warn-fg: #b09840; --err-fg: #f07070;
}
html.light-mode {
  color-scheme: light;
  --bg:        #ffffff;
  --surface:   #fafafa;
  --border:    #dddddd;
  --border2:   #eeeeee;
  --border3:   #f0f0f0;
  --text:      #222222;
  --muted:     #888888;
  --faint:     #bbbbbb;
  --hover:     #f8f8f8;
  --sel:       #e8e8e8;
  --row-hover: #f0f0f0;
  --input-bg:  #ffffff;
  --btn-bg:    #ffffff;
  --error-bg:  #fff8f8;
  --del-hover: #fdecea;
  --shadow:    0 8px 40px rgba(0,0,0,0.18);
  --backdrop:  rgba(0,0,0,0.3);
  --score-0-bg: #e8b3b6; --score-0-fg: #4a0d12;
  --score-1-bg: #f8d7da; --score-1-fg: #721c24;
