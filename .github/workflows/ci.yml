name: Test and deploy

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.js'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fast logic tier (node:test) — extracts pure functions from the source and
      # runs them with no browser, gating the build before the 3-engine matrix.
      - name: Run unit tests
        run: npm run test:unit

      - name: Build minified site
        run: npm run build

      # The deployed artifact and the bytes the tests run against are the same
      # upload — build once here, every test shard and deploy pulls this.
      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    # Backstop only — the real gate is the step-level timeout on "Run tests".
    timeout-minutes: 20
    # One job per browser, each running Playwright single-worker (webkit flakes
    # under parallel-worker load — see tests/browser/flaky.md). Sharding keeps that
    # per-job determinism while the three engines run concurrently, so the full
    # 777-test matrix finishes in ~one browser's wall-clock instead of 3× it.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Cache Playwright browser binaries per engine — each shard installs only
      # its own. Key on package-lock (Playwright version → browser ABI).
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}

      # Always run install — idempotent (skips already-cached binaries) and
      # self-healing if the cache key ever lies. System deps aren't cached and
      # always need apt-get, so --with-deps stays on every run.
      - name: Install Playwright browser + system deps
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Download built site
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Run tests
        # Step-level, not job-level: an overrun here FAILS the job (run → failure
        # → GitHub emails). A job-level timeout CANCELS instead, which GitHub
        # never notifies on. Don't hoist this to the job. Verified on-runner.
        timeout-minutes: 10
        run: npm test -- --project=${{ matrix.browser }}
        env:
          GRAWLIX_SITE_DIR: dist

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v6
      - name: Download built site
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v5
